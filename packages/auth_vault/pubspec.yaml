name: hnuhole_auth_vault
description: Device bound, durable authentication record storage.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: org.hnuhole.authvault
        pluginClass: AuthVaultPlugin
      ios:
        pluginClass: AuthVaultPlugin
