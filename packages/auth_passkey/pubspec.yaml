name: hnuhole_auth_passkey
description: Native, server-authorized discoverable Passkey bridge.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: org.hnuhole.authpasskey
        pluginClass: AuthPasskeyPlugin
      ios:
        pluginClass: AuthPasskeyPlugin
