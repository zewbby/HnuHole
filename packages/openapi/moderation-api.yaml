openapi: 3.0.3
info:
  title: HnuHole moderation and appeal API
  version: 0.1.0
  description: REVIEWER handles reports, content takedown, profile reset and bounded mute. ADMIN additionally bans/unbans
    and manages roles. Management DTOs expose platform numbers, authorized public snapshots and submitted materials;
    never email, qualification slots, internal account mappings, reporter identities or other masks. HTTPS only.
    No redirects, user-supplied URLs, or extra request fields. Every successful business response is committed inside
    the existing final C Safety Gate transaction. Only implemented post targets are described; comment, chat, push
    and full interaction inbox APIs are absent.
servers:
- url: /
paths:
  /api/v1/moderation-access/sessions:
    post:
      operationId: createModerationAccessSession
      summary: Authenticate for own handling notices and appeals
      description: Uses the existing username/password verifier with dummy work for unknown users. Allows ACTIVE
        accounts including banned accounts; PENDING_CLOSE/CLOSED are refused. Never cancels closure, advances ordinary
        session generation, replaces the mobile session, or enables community/management APIs. A repeated successful
        restricted login replaces only the previous restricted capability. No Idempotency-Key or Authorization header
        is accepted.
      security: []
      requestBody:
        required: true
        x-max-request-bytes: 8192
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationAccessInput'
      responses:
        '201':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationAccessSession'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/moderation-access/session-revocations:
    post:
      operationId: revokeModerationAccessSession
      summary: Revoke this restricted capability
      description: 'Empty body and no query parameters; Authorization: Bearer uses the restricted token. An ordinary
        bearer does not become a logout capability here. Does not revoke or renew a normal session.'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/sanctions/{sanctionId}:
    parameters:
    - name: sanctionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    get:
      operationId: getOwnSanction
      summary: Read own punishment and appeal availability
      description: Ordinary or MODERATION_SELF session. Only this account's sanction is visible. Expiry removes
        only the corresponding restriction; appeal review continues. Read access does not disclose reporter information.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sanction'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/sanctions/{sanctionId}/appeals/{requestId}:
    parameters:
    - name: sanctionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    - name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    put:
      operationId: submitAppeal
      summary: Start a new appeal attempt for own sanction
      description: Original request UUID binds complete material, excluding optional retryToken. Same-key same-material
        replay returns the original appeal. Initial requests can omit retryToken only before a reconciliation fence
        exists. A missing-result GET seals all old attempts and only its latest retryToken permits retry; otherwise
        409 REPORT_ATTEMPT_SEALED. At most one PENDING appeal per sanction, at most three distinct attempts across
        all identities. A new attempt after closure requires new material. Merely opening this endpoint's UI does
        not consume an attempt. Expired sanctions remain appealable; a revoked sanction cannot receive a new attempt.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        x-max-request-bytes: 12582912
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialAppealMaterial'
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/sanctions/{sanctionId}/appeal-requests/{requestId}:
    parameters:
    - name: sanctionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    - name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    get:
      operationId: getAppealSubmissionResult
      summary: Reconcile the original appeal submission
      description: Use the original parent and requestId after unknown result. Missing originals atomically return
        NOT_SUBMITTED with a newly rotated retryToken and seal every older attempt. Retry the same parent/request/material
        with the latest token; repeated missing GET rotates it again.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/appeals/{appealId}:
    parameters:
    - name: appealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    get:
      operationId: getOwnAppeal
      summary: Read own appeal and retained material
      description: Ordinary or MODERATION_SELF session. Returns at most the first appeal batch and optional nextMaterialsCursor.
        No original reviewer platform number, reporter identity or internal account mapping is returned.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/appeals/{appealId}/materials:
    parameters:
    - name: appealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    get:
      operationId: listOwnAppealMaterials
      summary: Read the next retained appeal batch
      description: Ordinary or MODERATION_SELF session, restricted to this account's own appeal. Appeal batches
        omit reason, platform numbers and reporter identifiers. At most one batch per page, ascending creation time
        then submission UUID. Omit cursor for the first batch, then pass nextCursor unchanged and URL-encoded. Only
        one nonempty cursor query parameter is accepted; duplicate/unknown query fields and request bodies are rejected.
        No limit query is supported.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque server nextCursor or parent nextReportsCursor/nextMaterialsCursor; pass unchanged. Current
          encoding is RFC3339Nano time, literal |, canonical report/request UUID.
  /api/v1/appeals/{appealId}/materials/{requestId}:
    parameters:
    - name: appealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    - name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    put:
      operationId: appendAppealMaterial
      summary: Append an independent batch to a pending appeal
      description: Only PENDING appeals accept new batches. Each batch has its own original request UUID; replay
        preserves earlier batches. Missing-result reconciliation rotates retryToken and seals older attempts; only
        the latest token permits retry after that fence. Optional retryToken never changes the material fingerprint.
        Append does not consume any of the three appeal attempts. No confirmed limit on append count is introduced.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        x-max-request-bytes: 12582912
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendedAppealMaterial'
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/appeals/{appealId}/material-requests/{requestId}:
    parameters:
    - name: appealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    - name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    get:
      operationId: getAppealAppendResult
      summary: Reconcile an original appeal append
      description: Returns SUBMITTED with the current appeal or NOT_SUBMITTED plus a freshly rotated retryToken
        for this account/appeal/request. Missing-result reconciliation seals every previous attempt. Preserve the
        original batch key/material and attach only the latest token when retrying.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/moderation/me:
    get:
      operationId: getModerationIdentity
      summary: Read own effective management role
      description: Ordinary session with REVIEWER or ADMIN role required. MODERATION_SELF is never accepted.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationIdentity'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/moderation/cases:
    get:
      operationId: listModerationCases
      summary: List report cases
      description: Ordinary authorized management role. Descending creation time and case UUID. Pass nextBefore
        unchanged; this is a server-owned cursor. Lists omit evidence and reporter identity.
      security:
      - bearerAuth: []
      parameters:
      - name: before
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque server nextBefore continuation; pass unchanged. Current encoding is RFC3339Nano time,
          literal |, and canonical case UUID; URL-encode it.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/moderation/cases/{caseId}:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    get:
      operationId: getModerationCase
      summary: Read authorized case evidence
      description: Public snapshot plus at most the first retained report batch and optional nextReportsCursor.
        Each report batch keeps its original reason. No reporter identifiers, email, internal account IDs or other
        identity list.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/moderation/cases/{caseId}/reports:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    get:
      operationId: listModerationReportMaterials
      summary: Read the next retained report batch
      description: Ordinary REVIEWER or ADMIN session required; MODERATION_SELF is refused. Report batches retain
        their individual reason without reporter identifiers. At most one batch per page, ascending creation time
        then submission UUID. Omit cursor for the first batch, then pass nextCursor unchanged and URL-encoded. Only
        one nonempty cursor query parameter is accepted; duplicate/unknown query fields and request bodies are rejected.
        No limit query is supported.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportMaterialPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Opaque server nextCursor or parent nextReportsCursor/nextMaterialsCursor; pass unchanged. Current
          encoding is RFC3339Nano time, literal |, canonical report/request UUID.
  /api/v1/moderation/cases/{caseId}/claim:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    post:
      operationId: claimModerationCase
      summary: Mark a case processing
      description: Atomically checks expectedVersion and current content lifecycle. Original commandId is idempotent;
        retry with unchanged fields. Author deletion closes unfinished cases and prevents later punitive processing.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        x-max-request-bytes: 12582912
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCommand'
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/moderation/cases/{caseId}/decision:
    parameters:
    - name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    post:
      operationId: decideModerationCase
      summary: Finish a case with an authorized action
      description: Reviewer may dismiss, take down, reset profile or impose bounded mute. Only ADMIN may ban. The
        result, restriction/session revocation, publication stop, notification and operation audit commit together.
        Separate punishments overlap to their latest applicable end; they do not add durations.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        x-max-request-bytes: 12582912
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseDecisionCommand'
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/moderation/appeals:
    get:
      operationId: listModerationAppeals
      summary: List pending appeals for review
      description: Returns only PENDING appeals, descending by creation time and appeal UUID, with limit and opaque
        compound before pagination. List entries contain metadata and materials=[]; detail retains all actual submitted
        materials. Requires an ordinary management session.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Committed response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Session-Expires-At:
              $ref: '#/components/headers/SessionExpiresAt'
            Server-Time:
              $ref: '#/components/headers/ServerTime'
          content:
            application/json:
              schema:
