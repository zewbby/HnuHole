  /api/v1/moderation/accounts:
    get:
      operationId: searchModerationAccount
      summary: List accounts or search one exact platform number
      description: Without number, returns the initial directory with permitted account metadata in ascending six-digit
        platform-number order and sanctions=[]. Optional number searches exactly that platform number and includes
        recorded sanctions. Optional before continues strictly after a six-digit platform number; preserve leading
        zeros. Never supports email, internal-account-ID or other-mask lookup.
      security:
      - bearerAuth: []
      parameters:
      - name: number
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlatformNumber'
        description: Optional exact platform number. Omit to list the initial account directory.
      - name: before
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlatformNumber'
        description: Ascending continuation returned by nextBefore; despite its name, selects platform numbers strictly
          greater than this six-digit value.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
      responses:
        '200':
          description: Committed response.
          headers:
