      summary: Accept or reject an appeal with explanation
      description: The original punisher cannot decide this appeal. BAN appeals require another ADMIN; other actions
        require another authorized reviewer. Without another reviewer the appeal stays pending, retains material
        and consumes no extra attempt. Acceptance revokes only its sanction, recalculates remaining effective restrictions
        and restores only eligible content never author-deleted or still hidden for another reason.
      security:
