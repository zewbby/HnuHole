        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: canonical-unpadded-base64url-32-bytes
      description: An ordinary C session for community and management operations. Explicit self-service operations
        also accept the isolated MODERATION_SELF bearer.
  headers:
    RequestId:
      required: true
      description: Server-generated request identifier; error body requestId equals this value.
      schema:
        type: string
        minLength: 22
        maxLength: 22
    NoStore:
      required: true
      schema:
        type: string
        enum:
        - no-store
    SessionExpiresAt:
      required: true
      description: Committed deadline of the bearer used for this request. Ordinary sessions follow existing renewal
        rules. MODERATION_SELF has a fixed 24-hour deadline and is never renewed.
      schema:
        type: string
        format: date-time
    ServerTime:
      required: true
      description: Final C Gate trusted decision time.
      schema:
        type: string
        format: date-time
    RetryAfter:
      required: true
      description: Retry delay in seconds; does not establish a previous mutation outcome.
      schema:
        type: integer
        minimum: 1
        maximum: 86400
  responses:
    Error400:
      description: Malformed input, invalid original image, noncanonical identifier, unknown or duplicate JSON fields,
        unexpected/duplicate query values, or invalid cursor.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error401:
      description: Invalid, expired, replaced, revoked or wrong-scope bearer; no ordinary session is restored by
        a restricted token.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error403:
      description: The authenticated account or role cannot perform this operation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error404:
      description: The authorized resource is unavailable in this account/identity scope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error405:
      description: Unsupported HTTP method. Allow identifies permitted methods.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error409:
      description: Original request key conflicts with its material, concurrent state/version changed, appeal pending/closed/limited,
        or operation is no longer allowed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error415:
      description: Only application/json with optional UTF-8 charset is accepted.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error429:
      description: Bounded network/password-worker budget exceeded; retry using the original mutation key where
        applicable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error503:
      description: C Gate frozen/unavailable, storage unavailable, or required subsystem unavailable. No mutation
        success is implied.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      not:
        enum:
        - 00000000-0000-0000-0000-000000000000
      description: Canonical lowercase, nonzero UUID. Resource identifiers never authorize access.
    DateTime:
      type: string
      format: date-time
    ErrorBody:
      type: object
      additionalProperties: false
      required:
      - error
      - requestId
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: false
              required:
              - retryAfterSeconds
              properties:
                retryAfterSeconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
        requestId:
          type: string
          minLength: 22
          maxLength: 22
    Image:
      type: object
      additionalProperties: false
      required:
      - mime
      - base64
      properties:
        mime:
          type: string
          enum:
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
        base64:
          type: string
          maxLength: 2796204
          minLength: 4
          format: byte
          description: Canonical padded standard Base64 of validated original image bytes. Decoded bytes must be
            1..2097152; original MIME must match inspection.
          x-max-decoded-bytes: 2097152
    Material:
      type: object
      additionalProperties: false
      required:
      - description
      - images
      - createdAt
      properties:
        description:
          type: string
          maxLength: 500
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          maxItems: 6
          x-max-total-decoded-bytes: 8388608
        createdAt:
          $ref: '#/components/schemas/DateTime'
      description: One retained appeal submission with server-assigned createdAt. Appeal batches never contain reason,
        request/retry tokens, reporter identity or internal account mappings. Initial appeal accepts at most six
        images; each append at most three; 8388608 decoded bytes per submission.
    Sanction:
      type: object
      additionalProperties: false
      required:
      - id
      - caseId
      - action
      - reason
      - startsAt
      - endsAt
      - revokedAt
      - postId
      - appealCount
      - activeAppealId
      properties:
        conversationId:
          $ref: '#/components/schemas/UUID'
          description: Present only for a private-message case; postId is then empty.
        id:
          $ref: '#/components/schemas/UUID'
        caseId:
          $ref: '#/components/schemas/UUID'
        action:
          type: string
          enum:
          - TAKEDOWN
          - MUTE
          - BAN
          - RESET_NICKNAME
          - RESET_AVATAR
        reason:
          type: string
          maxLength: 500
        startsAt:
          $ref: '#/components/schemas/DateTime'
        endsAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        postId:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: string
            enum: ['']
        commentId:
          $ref: '#/components/schemas/UUID'
          description: Optional concrete comment or reply within postId; omitted for a post target.
        appealCount:
          type: integer
          minimum: 0
          maximum: 3
        activeAppealId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          not:
            enum:
            - 00000000-0000-0000-0000-000000000000
          description: Canonical lowercase, nonzero UUID. Resource identifiers never authorize access.
          nullable: true
    Appeal:
      type: object
      additionalProperties: false
      required:
      - id
      - sanctionId
      - caseId
      - state
      - ordinal
      - version
      - reason
      - action
      - materials
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        sanctionId:
          $ref: '#/components/schemas/UUID'
        caseId:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
        ordinal:
          type: integer
          minimum: 1
          maximum: 3
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          maxLength: 500
        action:
          type: string
          enum:
          - TAKEDOWN
          - MUTE
          - BAN
          - RESET_NICKNAME
          - RESET_AVATAR
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
          maxItems: 1
        nextMaterialsCursor:
          type: string
          minLength: 1
          readOnly: true
          description: Opaque server continuation. Pass unchanged and URL-encoded. Current encoding is RFC3339Nano
            time, literal |, and a canonical submission UUID; ordering is ascending creation time then UUID. Omitted
            when there is no next batch.
      description: Self-service appeal always includes caseId, version and action and at most the first material
        batch. nextMaterialsCursor, when present, continues GET /api/v1/appeals/{appealId}/materials. No platformNumber
        or originalActorNumber, reporter identity or internal account mappings are returned.
    Opaque32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
    PlatformNumber:
      type: string
      pattern: ^[0-9]{6}$
      minLength: 6
      maxLength: 6
      description: Six-digit platform number; preserve leading zeros. Not a login identifier.
    ModerationAccessInput:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          maxLength: 24
          minLength: 6
          pattern: ^[a-z][a-z0-9_]{5,23}$
        password:
          type: string
          maxLength: 512
          minLength: 1
          description: Same existing private credential verification and bounded worker as ordinary login; at most
            2048 UTF-8 bytes.
    ModerationAccessSession:
      type: object
      additionalProperties: false
      required:
      - sessionToken
      - moderationSubject
      - expiresAt
      - scope
      properties:
        sessionToken:
          $ref: '#/components/schemas/Opaque32'
        moderationSubject:
          $ref: '#/components/schemas/Opaque32'
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        scope:
          type: string
          enum:
          - MODERATION_SELF
      description: 'Independent 24-hour fixed-expiry self-service capability. moderationSubject is a keyed opaque
        local-material owner: stable for the same account incarnation and changes if a closed username is registered
        again. It is not accountId, a platform number or an authorization token. Store token separately from ordinary
        sessions.'
    InitialAppealMaterial:
      type: object
      additionalProperties: false
      required:
      - description
      - images
      properties:
        description:
          type: string
          maxLength: 500
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          maxItems: 6
          x-max-total-decoded-bytes: 8388608
        retryToken:
          $ref: '#/components/schemas/UUID'
      description: Nonblank explanation or at least one image required. Maximum six images, 2 MiB each, 8 MiB decoded
        total, 12 MiB JSON. createdAt is server-assigned and forbidden in this request. reason is a report-only
        output field and is forbidden in appeal writes.
    AppendedAppealMaterial:
      type: object
      additionalProperties: false
      required:
      - description
      - images
      properties:
        description:
          type: string
          maxLength: 500
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          maxItems: 3
          x-max-total-decoded-bytes: 8388608
        retryToken:
          $ref: '#/components/schemas/UUID'
      description: 'One independent append: nonblank explanation or at least one image; at most three images and
        8 MiB decoded total. Does not consume a new appeal attempt. reason is a report-only output field and is
        forbidden in appeal writes.'
    AppealResult:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - state
        - retryToken
        properties:
          state:
            type: string
            enum:
            - NOT_SUBMITTED
          retryToken:
            $ref: '#/components/schemas/UUID'
      - type: object
        additionalProperties: false
        required:
        - state
        - appeal
        properties:
          state:
            type: string
            enum:
            - SUBMITTED
          appeal:
            $ref: '#/components/schemas/Appeal'
    EvidenceImage:
      type: object
      additionalProperties: false
      required:
      - mime
      - base64
      properties:
        mime:
          type: string
          enum:
          - image/png
          - image/jpeg
          - image/gif
          - image/webp
        base64:
          type: string
          maxLength: 13981016
          minLength: 4
          format: byte
          description: Public post snapshot image under the existing post-image limit of 10485760 original bytes;
            not a supplemental 2 MiB image.
    Evidence:
      type: object
      additionalProperties: false
      required:
      - title
      - body
      - images
      properties:
        dmRecords:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [sequence, direction, kind, text, gap, imageIndex, retracted]
            properties:
              sequence: {type: integer, minimum: 1}
              direction: {type: string, enum: ['举报方', '被举报方']}
              kind: {type: string, enum: [TEXT, IMAGE]}
              text: {type: string}
              gap: {type: string}
              imageIndex: {type: integer, minimum: 0, description: One-based index into images; zero for text or gaps.}
              retracted: {type: boolean}
        title:
          type: string
        body:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceImage'
          maxItems: 200
      description: Immutable authorized evidence; DM uses structured dmRecords for attribution, at most 200 rows and 32 MiB total raw material. Public reports remain snapshots of visible post content. Public post images
        retain their post-image limits, independently from supplementary report-image limits.
    Case:
      type: object
      additionalProperties: false
      required:
      - id
      - number
      - postId
      - reason
      - state
      - version
      - createdAt
      - platformNumber
      - outcome
      - explanation
      properties:
        conversationId:
          $ref: '#/components/schemas/UUID'
          description: Present only for a private-message case; postId is then empty.
        id:
          $ref: '#/components/schemas/UUID'
        number:
          type: string
          pattern: ^[0-9]+$
        postId:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: string
            enum: ['']
        commentId:
          $ref: '#/components/schemas/UUID'
          description: Optional concrete comment or reply within postId; omitted for a post target.
        reason:
          type: string
          enum:
          - ADVERTISING
          - HARASSMENT
          - PRIVACY
          - FRAUD
          - ILLEGAL
          - OTHER
        state:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - ENDED
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          $ref: '#/components/schemas/DateTime'
        platformNumber:
          $ref: '#/components/schemas/PlatformNumber'
        outcome:
          type: string
          enum:
          - ''
          - UPHELD
          - DISMISSED
          - TARGET_DELETED
        explanation:
          type: string
        evidence:
          $ref: '#/components/schemas/Evidence'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportMaterial'
          maxItems: 1
        sanctions:
          type: array
          items:
            $ref: '#/components/schemas/Sanction'
        nextReportsCursor:
          type: string
          minLength: 1
          readOnly: true
          description: Opaque server continuation. Pass unchanged and URL-encoded. Current encoding is RFC3339Nano
            time, literal |, and a canonical submission UUID; ordering is ascending creation time then UUID. Omitted
            when there is no next batch.
      description: Lists omit detailed evidence/reports/sanctions. Detail returns the accepted public snapshot and
        at most the first report batch; nextReportsCursor, when present, continues GET /api/v1/moderation/cases/{caseId}/reports.
        No reporter account/identity, email, internal account mappings or other masks are exposed.
    CasePage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Case'
          maxItems: 50
        nextBefore:
          type: string
          nullable: true
    AdminAppeal:
      type: object
      additionalProperties: false
      required:
      - id
      - sanctionId
      - caseId
      - state
      - ordinal
      - version
      - reason
      - action
      - materials
      - platformNumber
      - originalActorNumber
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        sanctionId:
          $ref: '#/components/schemas/UUID'
        caseId:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - REJECTED
        ordinal:
          type: integer
          minimum: 1
          maximum: 3
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          maxLength: 500
        action:
          type: string
          enum:
          - TAKEDOWN
          - MUTE
          - BAN
          - RESET_NICKNAME
          - RESET_AVATAR
        materials:
          type: array
          items:
            $ref: '#/components/schemas/Material'
          maxItems: 1
        platformNumber:
          $ref: '#/components/schemas/PlatformNumber'
        originalActorNumber:
          $ref: '#/components/schemas/PlatformNumber'
        nextMaterialsCursor:
          type: string
          minLength: 1
          readOnly: true
          description: Opaque server continuation. Pass unchanged and URL-encoded. Current encoding is RFC3339Nano
            time, literal |, and a canonical submission UUID; ordering is ascending creation time then UUID. Omitted
            when there is no next batch.
      description: Management detail adds target and original actor platform numbers. Includes at most the first
        appeal batch; nextMaterialsCursor continues GET /api/v1/moderation/appeals/{appealId}/materials. No reporter
        identity, email, internal account mappings or other masks are exposed.
    AdminAppealList:
      type: object
      additionalProperties: false
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PendingAdminAppeal'
        nextBefore:
          type: string
          nullable: true
      description: Only PENDING appeals, newest first by creation time then appeal UUID. nextBefore is null at end;
        otherwise pass the opaque time|UUID cursor unchanged.
    ModerationIdentity:
      type: object
      additionalProperties: false
      required:
      - role
      - platformNumber
      properties:
        role:
          type: string
          enum:
          - REVIEWER
          - ADMIN
        platformNumber:
          $ref: '#/components/schemas/PlatformNumber'
    ModerationAccount:
      type: object
      additionalProperties: false
      required:
      - platformNumber
      - createdAt
      - state
      - violationCount
      - sanctions
      properties:
        platformNumber:
          $ref: '#/components/schemas/PlatformNumber'
        createdAt:
          type: string
          format: date-time
          nullable: true
        state:
          type: string
          enum:
          - ACTIVE
          - PENDING_CLOSE
          - CLOSED
        violationCount:
          type: integer
          minimum: 0
        sanctions:
          type: array
          items:
            $ref: '#/components/schemas/Sanction'
      description: Only permitted platform metadata. Legacy registrations have createdAt=null when no historical
        registration timestamp exists. New registrations since migration 0015 use the database transaction timestamp.
        Initial directory items have sanctions=[]; an exact number search includes that account's recorded sanctions.
        Received reports do not count as violations; revocation corrects its corresponding count.
    AccountSearch:
      type: object
      additionalProperties: false
      required:
      - items
      - nextBefore
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ModerationAccount'
        nextBefore:
          type: string
          nullable: true
          pattern: ^[0-9]{6}$
      description: Without number this is the initial account directory, ordered by six-digit platform number ascending.
        With number it is an exact-match search returning zero or one item. nextBefore is null at end; otherwise
        it is the final returned platform number and excludes that number from the next page.
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - actorNumber
      - targetNumber
      - action
      - reason
      - createdAt
      - caseId
      properties:
        actorNumber:
          $ref: '#/components/schemas/PlatformNumber'
        targetNumber:
          $ref: '#/components/schemas/PlatformNumber'
        action:
          type: string
        reason:
          type: string
        createdAt:
          $ref: '#/components/schemas/DateTime'
        caseId:
          $ref: '#/components/schemas/UUID'
    AuditList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
    ClaimCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - expectedVersion
      properties:
        commandId:
          $ref: '#/components/schemas/UUID'
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    CaseDecisionCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - expectedVersion
      - action
      - days
      - reason
      properties:
        commandId:
          $ref: '#/components/schemas/UUID'
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum:
          - DISMISS
          - TAKEDOWN
          - MUTE
          - BAN
          - RESET_NICKNAME
          - RESET_AVATAR
        days:
          type: integer
          enum:
          - 0
          - 1
          - 3
          - 7
          - 30
        reason:
          type: string
          maxLength: 500
          minLength: 1
          pattern: \S
      description: Reason must contain non-whitespace text. MUTE accepts 1/3/7/30 days; BAN accepts 1/3/7/30 or
        0 for permanent and requires ADMIN. Other actions require days=0. Final version/state fencing prevents concurrent
        duplicate processing or punishment.
    AppealDecisionCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - expectedVersion
      - accept
      - reason
      properties:
        commandId:
          $ref: '#/components/schemas/UUID'
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        accept:
          type: boolean
        reason:
          type: string
          maxLength: 500
          minLength: 1
          pattern: \S
    RevokeCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - reason
      properties:
        commandId:
          $ref: '#/components/schemas/UUID'
        reason:
          type: string
          maxLength: 500
          minLength: 1
          pattern: \S
    RoleCommand:
      type: object
      additionalProperties: false
      required:
      - commandId
      - reason
      - role
      properties:
        commandId:
          $ref: '#/components/schemas/UUID'
        reason:
          type: string
          maxLength: 500
          minLength: 1
          pattern: \S
        role:
          type: string
          enum:
          - NONE
          - REVIEWER
          - ADMIN
    RoleResult:
      type: object
      additionalProperties: false
      required:
      - platformNumber
      - role
      properties:
        platformNumber:
          $ref: '#/components/schemas/PlatformNumber'
        role:
          type: string
          enum:
          - NONE
          - REVIEWER
          - ADMIN
    PendingAdminAppeal:
      type: object
      additionalProperties: false
      required:
      - id
      - sanctionId
      - caseId
      - state
      - ordinal
      - version
      - reason
      - action
      - materials
      - platformNumber
      - originalActorNumber
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        sanctionId:
          $ref: '#/components/schemas/UUID'
        caseId:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum:
          - PENDING
        ordinal:
          type: integer
          minimum: 1
          maximum: 3
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          maxLength: 500
        action:
          type: string
          enum:
          - TAKEDOWN
          - MUTE
          - BAN
          - RESET_NICKNAME
          - RESET_AVATAR
        materials:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/Material'
        platformNumber:
          $ref: '#/components/schemas/PlatformNumber'
        originalActorNumber:
          $ref: '#/components/schemas/PlatformNumber'
      description: Pending management list entry. Metadata includes caseId, version, action and the two permitted
        platform numbers. materials is always an empty array; open the authorized detail route to load all submitted
        material.
    ReportMaterial:
      type: object
      additionalProperties: false
      required:
      - reason
      - description
      - images
      - createdAt
      properties:
        reason:
          type: string
          enum:
          - ADVERTISING
          - HARASSMENT
          - PRIVACY
          - FRAUD
          - ILLEGAL
          - OTHER
          readOnly: true
        description:
          type: string
          maxLength: 200
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          maxItems: 6
          x-max-total-decoded-bytes: 8388608
        createdAt:
          $ref: '#/components/schemas/DateTime'
      description: One retained report submission. reason is the original category chosen by this reporter, even
        when reports of the same post snapshot with different reasons share one case. Read only; reporter account/identity,
        internal mappings, request/retry tokens and other masks are absent.
    MaterialPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/Material'
        nextCursor:
          type: string
          nullable: true
          description: Null at end. Otherwise pass this opaque ascending time|UUID continuation unchanged in cursor,
            URL-encoded.
      description: At most one independently retained material batch per page. End-of-list is an empty items array
        and null nextCursor. No limit parameter is accepted.
    ReportMaterialPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/ReportMaterial'
        nextCursor:
          type: string
          nullable: true
          description: Null at end. Otherwise pass this opaque ascending time|UUID continuation unchanged in cursor,
            URL-encoded.
      description: At most one independently retained material batch per page. End-of-list is an empty items array
        and null nextCursor. No limit parameter is accepted.
