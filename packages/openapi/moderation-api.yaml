      description: Requires another authorized operator; BAN reversal requires ADMIN. Other active sanctions and
        historical restriction facts continue to apply. Reversal never revives a revoked ordinary session or an
        author-deleted post.
      security:
      - bearerAuth: []
      requestBody:
