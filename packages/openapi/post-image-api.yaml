  /api/v1/posts/{postId}/images/{contentVersionId}/thumbnail:
    parameters:
    - name: postId
      in: path
      required: true
      schema: {type: string, format: uuid}
    - name: contentVersionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      operationId: readPostThumbnail
      security:
      - bearerAuth: []
      description: >-
        Protected static first-frame WebP poster, maximum 640 pixels per edge and
        524288 bytes. Applies EXIF orientation and strips metadata. The same
        resource/session/final C Gate is checked before and after transformation.
        No disk cache, public URL, Range or conditional caching. Original viewing
        and saving continue to use unchanged original bytes, including animation.
      responses:
        '200':
          description: Authorized bounded poster
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
            Session-Expires-At:
              schema: {type: string, format: date-time}
            Server-Time:
              schema: {type: string, format: date-time}
            X-Content-Type-Options:
              schema: {type: string, enum: [nosniff]}
            Content-Disposition:
              schema: {type: string, enum: [attachment]}
          content:
            image/webp:
              schema: {type: string, format: binary, maxLength: 524288}
        default:
          description: Existing private media error envelope; 401, 403, 404 or 503.
