openapi: 3.0.3
info:
  title: HnuHole protected post image API
  version: 0.1.0
  description: Explicit dev-only postImages configuration. Bearer stays in host transport.
    Upload capabilities can only complete accepted exact bytes, survive session replacement,
    expire within 15 minutes and the 24-hour attempt upload deadline, and still require
    final C Gate/account/identity/stop-generation checks. No query parameters, cookies
    as auth, redirects, public storage, Range or conditional caches. Duplicate/unknown
    JSON fields and noncanonical path IDs are rejected. See post-image-media-contract.md
    for byte framing, limits and production decisions.
servers:
- url: /
paths:
  /api/v1/posts/{postId}/images:
    parameters:
    - name: postId
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    get:
      operationId: readPostImages
      parameters:
      - name: X-Post-Preview
        in: header
        required: false
        schema: {type: string, enum: [thumbnail-v1]}
        description: Opt in to bounded WebP posters. Omission retains legacy original sources.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Authorized result
          headers: &id002
            Cache-Control: &id003
              required: true
              schema:
                type: string
                enum:
                - no-store
            X-Request-ID: &id004
              required: true
              schema:
                type: string
            Server-Time: &id005
              required: true
              schema:
                type: string
                format: date-time
            Session-Expires-At:
              required: true
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Rejected; never treat timeout/error as a new publish intent
