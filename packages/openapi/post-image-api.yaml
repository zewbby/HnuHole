components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    uploadOnly:
      type: http
      scheme: Upload
  schemas:
    Selection:
      type: object
      additionalProperties: false
      required:
      - mediaId
      - sha256
      - byteLength
      - mimeType
      - width
      - height
      properties:
        mediaId: *id001
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        byteLength:
          type: integer
          minimum: 1
          maximum: 10485760
        mimeType: &id006
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/gif
          - image/webp
        width:
          type: integer
          minimum: 1
          maximum: 16384
        height:
          type: integer
          minimum: 1
          maximum: 16384
      description: Immutable ordered selection; canonical nonzero UUID, maximum 12582912
        pixels. All declared values are verified against full bytes.
    Source:
      type: object
      additionalProperties: false
      required:
      - path
      - mimeType
      - byteLength
      properties:
        path:
          type: string
          pattern: ^/api/v1/posts/[0-9a-f-]{36}/images/[0-9a-f-]{36}/original$
        mimeType: *id006
        byteLength:
          type: integer
          minimum: 1
          maximum: 10485760
    ThumbnailSource:
      type: object
      additionalProperties: false
      required: [path, mimeType, maxByteLength]
      properties:
        path:
          type: string
          pattern: ^/api/v1/posts/[0-9a-f-]{36}/images/[0-9a-f-]{36}/thumbnail$
        mimeType: {type: string, enum: [image/webp]}
        maxByteLength: {type: integer, minimum: 1, maximum: 524288}
    Image:
      type: object
      additionalProperties: false
      required:
      - mediaId
      - contentVersionId
      - position
      - width
      - height
      - pixelWidth
      - pixelHeight
      - frames
      - animated
      - saveAllowed
      - thumbnail
      - full
      - original
      properties:
        mediaId: *id001
        contentVersionId: *id001
        position:
          type: integer
          minimum: 0
          maximum: 8
        width:
          type: integer
          minimum: 1
          maximum: 16384
        height:
          type: integer
          minimum: 1
          maximum: 16384
        pixelWidth:
          type: integer
          minimum: 1
          maximum: 16384
        pixelHeight:
          type: integer
          minimum: 1
          maximum: 16384
        frames:
          type: integer
          minimum: 1
          maximum: 120
        animated:
          type: boolean
        saveAllowed:
          type: boolean
        thumbnail:
          oneOf:
          - $ref: '#/components/schemas/Source'
          - $ref: '#/components/schemas/ThumbnailSource'
        full:
          $ref: '#/components/schemas/Source'
        original:
          $ref: '#/components/schemas/Source'
      description: Full and original remain byte-exact. Explicit thumbnail-v1 clients
        receive a bounded static WebP preview when available; legacy sources remain valid.
        Pixel dimensions describe the EXIF-oriented original.
    UploadItem:
      type: object
      additionalProperties: false
      required:
      - mediaId
      - sha256
      - byteLength
      - mimeType
      - width
      - height
      - position
      - uploaded
      properties:
        mediaId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        byteLength:
          type: integer
          minimum: 1
          maximum: 10485760
        mimeType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/gif
          - image/webp
        width:
          type: integer
          minimum: 1
          maximum: 16384
        height:
          type: integer
          minimum: 1
          maximum: 16384
        position:
          type: integer
          minimum: 0
          maximum: 8
        uploaded:
          type: boolean
      description: Immutable ordered selection; canonical nonzero UUID, maximum 12582912
        pixels. All declared values are verified against full bytes.
    Group:
      type: object
      additionalProperties: false
      required:
      - postId
      - images
      - accessValidUntil
      properties:
        postId: *id001
        images:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/Image'
        accessValidUntil:
          type: string
          format: date-time
          description: At most 60 seconds from Server-Time and no later than session
            expiry. Host revokes terminally on known invalidation or timeout.
    UploadState:
      type: object
      additionalProperties: false
      required:
      - taskId
      - postId
      - attemptVersion
      - items
      properties:
        taskId: *id001
        postId: *id001
        attemptVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        items:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/UploadItem'
    Grant:
      type: object
      additionalProperties: false
      required:
      - taskId
      - mediaId
      - attemptVersion
      - uploadToken
      - expiresAt
      properties:
        taskId: *id001
        mediaId: *id001
        attemptVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        uploadToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Canonical unpadded 32-byte random capability; upload only,
            never pass to viewer or logs.
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      - requestId
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
