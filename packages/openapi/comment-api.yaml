          - ACCEPTED
        operation:
          type: string
          enum:
          - CREATE
          - RETRY
        taskId:
          $ref: '#/components/schemas/UUID'
        attemptVersion:
          type: integer
          minimum: 1
      description: Original immutable acceptance receipt; not the latest task state. Read taskId to learn whether
        it later published or failed.
    AppliedTaskReceipt:
      type: object
      additionalProperties: false
