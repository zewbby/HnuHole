    NotAcceptedReceipt:
      type: object
      additionalProperties: false
      required:
      - state
      - operation
      - errorCode
      properties:
        state:
          type: string
          enum:
          - NOT_ACCEPTED
        operation:
          type: string
          enum:
          - CREATE
          - RETRY
          - ABANDON
          - DELETE
          - SET_LIKE
        errorCode:
          type: string
          enum:
          - SEALED
      description: Authoritatively observed permanent NOT_ACCEPTED seal of this key/operation only; no task is fabricated.
        CREATE can be explicitly restored to current same-post temporary input only after successful journal removal;
        RETRY/ABANDON must reconcile the latest owner task before further actions. Timeout, empty lookup or HTTP
        error cannot produce this state.
