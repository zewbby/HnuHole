          replyTo:
            type: object
            nullable: true
            enum:
            - null
      - properties:
          rootCommentId:
            $ref: '#/components/schemas/UUID'
          targetCommentId:
            $ref: '#/components/schemas/UUID'
          replyTo:
            $ref: '#/components/schemas/ReplyRelation'
          replyCount:
            type: integer
            minimum: 0
            maximum: 0
      description: Authorized public content only. isPostAuthor compares actual public author identity with post
        author, never nickname/account equality. Body initially four lines in UI with independent expand; all nested
        replies indent only one level.
      anyOf:
      - properties:
          body:
            type: string
            pattern: \S
      - properties:
          image:
            $ref: '#/components/schemas/PublishedCommentImage'
    CommentPage:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - comments
      - nextCursor
      - totalCount
      properties:
        snapshotId:
          $ref: '#/components/schemas/OpaqueCursor'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
          maxItems: 50
        nextCursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: string
            nullable: true
            enum:
            - null
        totalCount:
          type: integer
          minimum: 0
          description: Current live main comments plus all live nested replies, not this page size. Root deletion
            subtracts its entire floor; deleting a reply subtracts only that reply.
      description: 'Frozen read order: top ten likes descending, publishedAt ascending, raw UUID ascending; remaining
        comments time/UUID ascending excluding top ten. Like counts may change without reordering; others new content
        waits for re-entry or collapse/reopen.'
      x-order-contract:
        topCount: 10
        topOrder:
        - likeCount:desc
        - publishedAt:asc
        - id:uuid-bytes-asc
        remainderOrder:
        - publishedAt:asc
        - id:uuid-bytes-asc
        liveReorder: false
    ReplyPage:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - rootCommentId
      - comments
      - nextCursor
      - remainingCount
      properties:
        snapshotId:
          $ref: '#/components/schemas/OpaqueCursor'
        rootCommentId:
          $ref: '#/components/schemas/UUID'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/PublicComment'
          maxItems: 50
        nextCursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: string
            nullable: true
            enum:
            - null
        remainingCount:
          type: integer
          minimum: 0
      description: Default top five only. Explicit expanded=true loads remaining replies in chronological pages
        of 50; no scroll-triggered expansion and no duplicates of top five. Collapse restores five without reranking.
      x-order-contract:
        topCount: 5
        topOrder:
        - likeCount:desc
        - publishedAt:asc
        - id:uuid-bytes-asc
        remainderOrder:
        - publishedAt:asc
        - id:uuid-bytes-asc
        liveReorder: false
        manualExpansion: true
    CommentLocation:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - commentId
      - rootCommentId
      - cursor
      properties:
        snapshotId:
          $ref: '#/components/schemas/OpaqueCursor'
        commentId:
          $ref: '#/components/schemas/UUID'
        rootCommentId:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: string
            nullable: true
            enum:
            - null
        cursor:
          oneOf:
          - $ref: '#/components/schemas/OpaqueCursor'
          - type: string
            nullable: true
            enum:
            - null
      description: Exact content location in snapshot; expand floor and highlight without moving upper post. No
        original text. Missing/deleted/inaccessible target uniformly COMMENT_NOT_FOUND; repeatable nonblocking short
        UI hint.
    CommentError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INVALID_REQUEST
              - UNAUTHORIZED
              - FORBIDDEN
              - COMMAND_CONFLICT
              - COMMENT_NOT_FOUND
              - TASK_NOT_FOUND
              - STALE_ATTEMPT
              - TASK_NOT_FAILED
              - INVALID_CONTENT
              - IDENTITY_UNAVAILABLE
              - TARGET_UNAVAILABLE
              - RATE_LIMITED
              - SERVICE_UNAVAILABLE
            message:
              type: string
              maxLength: 200
      description: Bounded public error, no account links, bodies, tokens, raw command keys or database errors.
        HTTP errors do not establish whether a command was accepted.
    Sha256:
      type: string
      minLength: 64
      maxLength: 64
      pattern: ^[0-9a-f]{64}$
      description: SHA-256 of the exact original image bytes; existing postmedia selection semantics. This is distinct
        from the pending comment command framing.
    RejectedReceipt:
      type: object
      additionalProperties: false
      required:
      - state
      - operation
      - errorCode
      properties:
        state:
          type: string
          enum:
          - REJECTED
        operation:
          type: string
          enum:
          - CREATE
          - RETRY
          - ABANDON
          - DELETE
          - SET_LIKE
        errorCode:
          type: string
          enum:
          - INVALID_CONTENT
          - IDENTITY_UNAVAILABLE
          - TARGET_UNAVAILABLE
          - PERMISSION_DENIED
          - STALE_ATTEMPT
          - TASK_NOT_FAILED
      description: Authoritatively observed durable rejection of the original account-scoped key; no accepted task
        is fabricated. For CREATE there is no task/binding. Restore preserved content only by explicit user action
        into the current same-post temporary editor after journal removal succeeds. For rejected RETRY/ABANDON,
        read the latest owner task snapshot before offering another action; stale local FAILED cannot unlock anything.
    TaskCommandReceipt:
      oneOf:
      - $ref: '#/components/schemas/AcceptedTaskReceipt'
      - $ref: '#/components/schemas/AppliedTaskReceipt'
      - $ref: '#/components/schemas/RejectedReceipt'
      - $ref: '#/components/schemas/NotAcceptedReceipt'
    DeleteCommandReceipt:
      oneOf:
      - $ref: '#/components/schemas/DeleteAppliedReceipt'
      - $ref: '#/components/schemas/RejectedReceipt'
      - $ref: '#/components/schemas/NotAcceptedReceipt'
    LikeCommandReceipt:
      oneOf:
      - $ref: '#/components/schemas/LikeAppliedReceipt'
      - $ref: '#/components/schemas/RejectedReceipt'
      - $ref: '#/components/schemas/NotAcceptedReceipt'
