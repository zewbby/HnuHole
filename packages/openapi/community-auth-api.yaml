      - Closure
      security:
      - bearerAuth: []
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ClosureRequest"
      responses:
        '202':
          description: 原申请已持久受理，不等于正式关闭；同申请重试仍为原dueAt。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClosureAccepted"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '410':
          "$ref": "#/components/responses/Gone"
      x-retry-semantics: closureId-is-idempotency-key-same-account-same-statusDigest
  "/api/v1/account-closures/{closureId}":
    get:
      operationId: getAccountClosureStatus
      summary: 用独立秘密读取本次注销状态及已签收据
      description: '仅Authorization: ClosureStatus <status_secret43字符>，无Bearer/body/query秘密。权威库校验同closureId摘要，只返回受限状态：PENDING、FINALIZING、CANCELLED、CLOSED_RELEASE_PENDING、RELEASED。不返回账号/用户名/处罚原因、不恢复会话或取消申请。dueAt只在PENDING/FINALIZING返回；CANCELLED只返回state并最多保留30天。真正CLOSED提交后才可签RELEASED收据；签名/投递未完CLOSED_RELEASE_PENDING，有已签收据可携给V；V持久ACK后RELEASED，至多30天后清状态秘密。不存在/错误秘密/已清理统一404，不区分；一次早到404仅表示此刻未见已提交记录，不能推断原POST不会提交。状态页不是主动登录。'
      tags:
      - Closure
      security:
      - closureStatus: []
      parameters:
      - "$ref": "#/components/parameters/ClosureIdPath"
      responses:
        '200':
          description: 只读原申请状态，无旧号控制权。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClosureStatus"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/internal/v1/slot-retirements":
    post:
      operationId: retireUnusedSlot
      summary: 受信V请求退役尚未开户槽位
      description: 仅独立内部入口，经双向TLS验证预配置V工作负载证书并验证V固定RETIRE-AUTH/V1签名、受信环境和用途；两者都必需，不接受任何客户端Bearer/SessionRevoke/ResetResult/ClosureStatus。OpenAPI
        3.0.3不能用原生mutualTLS securityScheme；security=[]只指没有HTTP认证，x-mtls-required必须由部署/验收强制，绝不能开放为匿名公共端点或相信可伪造代理证书头。V调用前已持久写同旧slot唯一退役待办，阻止旧slot续票；C以slot唯一约束与开户竞争。ABSENT→RETIRED与唯一receipt
        outbox在同一事务先持久提交，HSM仅在提交后依据该终态签RETIRED收据；收据签名/签名服务未就绪则202 RECEIPT_PENDING并有界重试，不返回任何可用于释放的签名。既有RETIRED可以重签同用途/slot，ACTIVE/CLOSED只409
        SLOT_NOT_RETIRABLE，不给账号/用户名。数据库不可确认为503未知；V持久保持原待办/配额，以同一退役授权重试取得收据再释放。RETIRED终态长期保留且与账号脱钩，不能靠超时释放配额。
      tags:
      - Internal
      security: []
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SlotRetirementRequest"
      responses:
        '200':
          description: 该slot已持久RETIRED，收据可持久处理后放开V当前配额。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SlotRetirementResponse"
        '202':
          description: 终态和outbox已提交，尚无可验签收据；V不放开配额。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Retry-After:
              "$ref": "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SlotRetirementPending"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      x-mtls-required: true
      x-allowed-peer: eligibility-verifier
      x-public-exposure: false
      x-retry-semantics: slot-and-purpose-idempotent-postcommit-signing
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
      description: 仅32字节随机会话token的43字符规范base64url；不接受JWT/校邮资格/其他能力秘密。
    sessionRevoke:
      type: apiKey
      in: header
      name: Authorization
      description: 严格SessionRevoke <43字符规范base64url秘密>；只定向撤销绑定旧会话，不可访问社区。
    resetResult:
      type: apiKey
      in: header
      name: Authorization
      description: 严格ResetResult <原32字节提交幂等键>，另须Reset-Intent-ID；只看一笔无秘密结果。
    closureStatus:
      type: apiKey
      in: header
      name: Authorization
      description: 严格ClosureStatus <32字节status_secret>；只看同closureId状态和已签收据。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        "$ref": "#/components/schemas/Base64url32"
      description: C本方一次用户操作随机32字节；发送前固定、重试共用，同键不同负载409。不能与V共用，也不能记录到日志。请求绑定用数据库外服务器HMAC密钥，不存密码/恢复码快速哈希。作用域为本operation；原完整结果有界清理后仅留域分离键摘要墓碑，旧键410
        RESULT_EXPIRED，不重新执行，不承诺原提交结论。
    ResetIntentIdHeader:
      name: Reset-Intent-ID
      in: header
      required: true
      schema:
        "$ref": "#/components/schemas/Base64url32"
      description: 原重设意图ID；与ResetResult原键共同限定一笔无秘密结果，禁止进入日志。
    CredentialChangeId:
      name: Credential-Change-ID
      in: header
      required: true
      schema:
        "$ref": "#/components/schemas/Base64url32"
      description: 已通过新鲜密码证明的5分钟删除意图ID；不能成为普通社区认证，禁止日志。
    RotationIntentId:
      name: rotationIntentId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Base64url32"
    CredentialIdPath:
      name: credentialId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/CredentialId"
    ClosureIdPath:
      name: closureId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Base64url32"
  headers:
    NoStore:
      required: true
      description: 所有成功、错误和无体响应必须禁止缓存。
      schema:
        type: string
        enum:
        - no-store
    RequestId:
      required: true
      description: C每次服务端独立生成16字节随机编号；不继承客户端或V编号，不含秘密。
      schema:
        "$ref": "#/components/schemas/Base64url16"
    RetryAfter:
      required: true
      description: 有界安全重试秒数，不揭示账号/配额/凭据是否存在。
      schema:
        type: integer
        minimum: 1
        maximum: 300
    SessionExpiresAt:
      required: true
      description: 此次成功裁决后的当前会话到期UTC时间；不包含token或隐私身份。
      schema:
        "$ref": "#/components/schemas/DateTime"
  schemas:
    Base64url16:
      type: string
      minLength: 22
      maxLength: 22
      pattern: "^[A-Za-z0-9_-]{21}[AQgw]$"
      description: 安全随机16字节，RFC 4648无填充base64url；重编码须与输入相同。
    Base64url32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      description: 固定32字节，RFC 4648无填充base64url；禁止填充、非零尾位和非规范编码。
    Base64url64:
      type: string
      minLength: 86
      maxLength: 86
      pattern: "^[A-Za-z0-9_-]{85}[AQgw]$"
      description: 固定64字节，RFC 4648无填充base64url；重编码须与输入相同。
    CredentialId:
      type: string
      minLength: 2
      maxLength: 1364
      pattern: "^[A-Za-z0-9_-]+$"
      description: WebAuthn credential ID；解码后1–1023字节，重新编码须相同；id与rawId必须相等。
    Username:
      type: string
      minLength: 6
      maxLength: 24
      pattern: "^[a-z][a-z0-9_]{5,23}$"
      description: 仅C使用的私有登录用户名；只接受规范ASCII小写；不可作为永久账号标识。
    PasswordInput:
      type: string
      minLength: 1
      maxLength: 512
      format: password
      description: 不进入日志。服务端统一NFC；最多2048个UTF-8输入字节、512个输入码点。创建/重设时规范化后为15–128个Unicode码点，并查弱/泄漏/用户名相关密码阻止名单；验证已有密码不得截断或改变既有规范化规则，短密码仅得统一认证失败。
    RecoveryCodeInput:
      type: string
      minLength: 26
      maxLength: 64
      pattern: "^[A-Za-z2-7 -]+$"
      description: 仅忽略ASCII空格与显示分组连字符、统一Base32大小写；处理后须为规范26字符、解码16字节并重编码相同（末尾零位正确）。禁止其他Unicode空白或相似字符。
    RecoveryCode:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[A-Z2-7]{25}[AEIMQUY4]$"
      description: 一次性展示的规范128位随机恢复码；原码不持久保存或重放。
    RegistrationTicket:
      type: string
      minLength: 208
      maxLength: 208
      pattern: "^[A-Za-z0-9_-]{208}$"
      description: REGISTER/V2固定二进制全文：ASCII("HNUHOLE/REGISTER/V2")||0x00||v_key_epoch:u32be||admission_window:u32be||slot_id[32]||pk_boot[32]||v_signature[64]，共156字节。未知版本/尾随字段/弱点公钥拒绝；不能使用JWT或JSON对象替代。
    RetirementAuthorization:
      type: string
      minLength: 164
      maxLength: 164
      pattern: "^[A-Za-z0-9_-]{164}$"
      description: RETIRE-AUTH/V1固定授权全文，123字节。域、v_key_epoch和old_slot必须验明；消息只允许退役尚未开户槽位，不承载邮箱。
    RetirementReceipt:
      type: string
      minLength: 159
      maxLength: 159
      pattern: "^[A-Za-z0-9_-]{158}[AEIMQUYcgkosw048]$"
      description: RETIRED/V1固定收据全文，119字节；仅依据已提交RETIRED终态签发。
    ReleaseReceipt:
      type: string
      minLength: 160
      maxLength: 160
      pattern: "^[A-Za-z0-9_-]{160}$"
      description: RELEASED/V1固定收据全文，120字节；仅依据已提交CLOSED终态签发。
    AccountId:
      type: string
      format: uuid
      description: C内部随机账号ID；仅对本人经认证返回，不是公开平台编号，不与V共享。
    DateTime:
      type: string
      format: date-time
      description: UTC RFC 3339时间；服务端生成，不接受客户端时间作为截止依据。
    RegistrationIntentRequest:
      type: object
      additionalProperties: false
      properties:
        registrationTicket:
          "$ref": "#/components/schemas/RegistrationTicket"
        username:
          "$ref": "#/components/schemas/Username"
        password:
          "$ref": "#/components/schemas/PasswordInput"
        installationId:
          "$ref": "#/components/schemas/Base64url16"
      required:
      - registrationTicket
      - username
      - password
      - installationId
    RegistrationIntentResponse:
      type: object
      additionalProperties: false
      properties:
        intentId:
          "$ref": "#/components/schemas/Base64url32"
        challenge:
          "$ref": "#/components/schemas/Base64url32"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
        recoveryCode:
          "$ref": "#/components/schemas/RecoveryCode"
      required:
      - intentId
      - challenge
      - expiresAt
      - recoveryCode
    RegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        intentId:
          "$ref": "#/components/schemas/Base64url32"
        bootstrapSignature:
          "$ref": "#/components/schemas/Base64url64"
        recoveryCodeConfirmation:
          "$ref": "#/components/schemas/RecoveryCodeInput"
      required:
      - intentId
      - bootstrapSignature
      - recoveryCodeConfirmation
    SessionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          "$ref": "#/components/schemas/Username"
        password:
          "$ref": "#/components/schemas/PasswordInput"
        installationId:
          "$ref": "#/components/schemas/Base64url16"
      required:
      - username
      - password
      - installationId
    SessionCreated:
      type: object
      additionalProperties: false
      properties:
        accountId:
          "$ref": "#/components/schemas/AccountId"
        sessionToken:
          "$ref": "#/components/schemas/Base64url32"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
      required:
      - accountId
      - sessionToken
      - expiresAt
    SessionResponse:
      type: object
      additionalProperties: false
      properties:
        accountId:
          "$ref": "#/components/schemas/AccountId"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
        username:
          "$ref": "#/components/schemas/Username"
      required:
      - accountId
      - expiresAt
      - username
    SessionRenewed:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
      required:
      - expiresAt
    CurrentDevice:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - CURRENT
        signedInAt:
          "$ref": "#/components/schemas/DateTime"
      required:
      - role
      - signedInAt
    ReplacedDevice:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - REPLACED
        signedInAt:
          "$ref": "#/components/schemas/DateTime"
        replacedAt:
          "$ref": "#/components/schemas/DateTime"
      required:
      - role
      - signedInAt
      - replacedAt
    DeviceList:
      type: object
      additionalProperties: false
      properties:
        current:
          "$ref": "#/components/schemas/CurrentDevice"
        lastReplaced:
          "$ref": "#/components/schemas/ReplacedDevice"
      required:
      - current
      description: 严格只有当前与最近一次被替代设备两类，最近记录最多保留30天；不返回安装ID、硬件指纹、型号、IP或令牌。
    RecoveryCodeResetRequest:
      type: object
      additionalProperties: false
      properties:
        recoveryCode:
          "$ref": "#/components/schemas/RecoveryCodeInput"
      required:
      - recoveryCode
    PasswordResetIntentResponse:
      type: object
      additionalProperties: false
      properties:
        resetIntentId:
          "$ref": "#/components/schemas/Base64url32"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
        username:
          "$ref": "#/components/schemas/Username"
        newRecoveryCode:
          "$ref": "#/components/schemas/RecoveryCode"
      required:
      - resetIntentId
      - expiresAt
      - username
      - newRecoveryCode
    PasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        resetIntentId:
          "$ref": "#/components/schemas/Base64url32"
        newPassword:
          "$ref": "#/components/schemas/PasswordInput"
        newRecoveryCodeConfirmation:
          "$ref": "#/components/schemas/RecoveryCodeInput"
      required:
      - resetIntentId
      - newPassword
      - newRecoveryCodeConfirmation
    ResetResult:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - COMMITTED
          - NOT_COMMITTED
      required:
      - state
    PendingResult:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - PENDING
      required:
      - state
    PasswordVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          "$ref": "#/components/schemas/PasswordInput"
      required:
      - password
    RecoveryCodeRotationResponse:
      type: object
      additionalProperties: false
      properties:
        rotationIntentId:
          "$ref": "#/components/schemas/Base64url32"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
        newRecoveryCode:
          "$ref": "#/components/schemas/RecoveryCode"
      required:
      - rotationIntentId
      - expiresAt
      - newRecoveryCode
    RecoveryCodeRotationConfirmation:
      type: object
      additionalProperties: false
      properties:
        newRecoveryCodeConfirmation:
          "$ref": "#/components/schemas/RecoveryCodeInput"
      required:
      - newRecoveryCodeConfirmation
    PasskeySummary:
      type: object
      additionalProperties: false
      properties:
        credentialId:
          "$ref": "#/components/schemas/CredentialId"
        createdAt:
          "$ref": "#/components/schemas/DateTime"
        backupEligible:
          type: boolean
        backedUp:
          type: boolean
      required:
      - credentialId
      - createdAt
      - backupEligible
      - backedUp
    RecoveryCredentials:
      type: object
      additionalProperties: false
      properties:
        recoveryCodeAvailable:
          type: boolean
          enum:
          - true
        passkeys:
          type: array
          minItems: 0
          maxItems: 10
          items:
            "$ref": "#/components/schemas/PasskeySummary"
      required:
      - recoveryCodeAvailable
      - passkeys
    EmptyRequest:
      type: object
      additionalProperties: false
      properties: {}
    PasskeyRequestOptions:
      type: object
      additionalProperties: false
      properties:
        challenge:
          "$ref": "#/components/schemas/Base64url32"
        rpId:
          type: string
          minLength: 1
          maxLength: 253
          description: 部署时固定的受信Hnuhole RP ID；不得取自请求或V响应。
        timeout:
          type: integer
          enum:
          - 60000
        userVerification:
          type: string
          enum:
          - required
      required:
      - challenge
      - rpId
      - timeout
      - userVerification
      description: 可发现凭据验证选项，不含allowCredentials或用户名；不请求扩展。
    PasskeyResetOptionsResponse:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          "$ref": "#/components/schemas/Base64url32"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
        publicKey:
          "$ref": "#/components/schemas/PasskeyRequestOptions"
      required:
      - challengeId
      - expiresAt
      - publicKey
    ClientExtensionResults:
      type: object
      additionalProperties: false
      properties: {}
      description: 本版不请求或接受WebAuthn扩展；只能为{}。
    AssertionResponse:
      type: object
      additionalProperties: false
      properties:
        clientDataJSON:
          type: string
          minLength: 2
          maxLength: 4096
          pattern: "^[A-Za-z0-9_-]+$"
          description: 无填充base64url，解码后1–3072字节，规范重编码；验证type、challenge、固定origin、crossOrigin。
        authenticatorData:
          type: string
          minLength: 50
          maxLength: 2731
          pattern: "^[A-Za-z0-9_-]+$"
          description: 无填充base64url，解码后37–2048字节；校验rpIdHash、UP/UV、签名计数及备份标志。
        signature:
          type: string
          minLength: 11
          maxLength: 1366
          pattern: "^[A-Za-z0-9_-]+$"
          description: 无填充base64url，解码后8–1024字节；按已登记COSE算法严格验签，ES256为规范DER签名。
        userHandle:
          "$ref": "#/components/schemas/Base64url32"
      required:
      - clientDataJSON
      - authenticatorData
      - signature
      - userHandle
    WebAuthnAssertion:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/CredentialId"
        rawId:
          "$ref": "#/components/schemas/CredentialId"
        type:
          type: string
          enum:
          - public-key
        response:
          "$ref": "#/components/schemas/AssertionResponse"
        clientExtensionResults:
          "$ref": "#/components/schemas/ClientExtensionResults"
      required:
      - id
      - rawId
      - type
      - response
      - clientExtensionResults
    PasskeyResetIntentRequest:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          "$ref": "#/components/schemas/Base64url32"
        webauthnAssertion:
          "$ref": "#/components/schemas/WebAuthnAssertion"
      required:
      - challengeId
      - webauthnAssertion
    PasskeyRp:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 253
          description: 部署时固定的受信RP ID；移动平台关联必须预先审阅。
        name:
          type: string
          enum:
          - Hnuhole
      required:
      - id
      - name
    PasskeyUser:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/Base64url32"
        name:
          "$ref": "#/components/schemas/Base64url32"
        displayName:
          type: string
          enum:
          - Hnuhole account
      required:
      - id
      - name
      - displayName
      description: C随机非邮箱用户句柄；name为同一id的base64url表示，不向同步服务发送私有登录用户名或真实姓名。
    PasskeyAlgorithm:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - public-key
        alg:
          type: integer
          enum:
          - -7
      required:
      - type
      - alg
      description: 首版仅ES256（COSE -7/P-256）；若要增加算法须另审兼容与验证规则。
    CredentialDescriptor:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - public-key
        id:
          "$ref": "#/components/schemas/CredentialId"
      required:
      - type
      - id
    AuthenticatorSelection:
      type: object
      additionalProperties: false
      properties:
        residentKey:
          type: string
          enum:
          - required
        requireResidentKey:
          type: boolean
          enum:
          - true
        userVerification:
          type: string
          enum:
          - required
      required:
      - residentKey
      - requireResidentKey
      - userVerification
    PasskeyCreationOptions:
      type: object
      additionalProperties: false
      properties:
        challenge:
          "$ref": "#/components/schemas/Base64url32"
        rp:
          "$ref": "#/components/schemas/PasskeyRp"
        user:
          "$ref": "#/components/schemas/PasskeyUser"
        pubKeyCredParams:
          type: array
          minItems: 1
          maxItems: 1
          items:
            "$ref": "#/components/schemas/PasskeyAlgorithm"
        timeout:
          type: integer
          enum:
          - 60000
        excludeCredentials:
          type: array
          minItems: 0
          maxItems: 10
          items:
            "$ref": "#/components/schemas/CredentialDescriptor"
        authenticatorSelection:
          "$ref": "#/components/schemas/AuthenticatorSelection"
        attestation:
          type: string
          enum:
          - none
      required:
      - challenge
      - rp
      - user
      - pubKeyCredParams
      - timeout
      - excludeCredentials
      - authenticatorSelection
      - attestation
    PasskeyOptionsResponse:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          "$ref": "#/components/schemas/Base64url32"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
        publicKey:
          "$ref": "#/components/schemas/PasskeyCreationOptions"
      required:
      - challengeId
      - expiresAt
      - publicKey
    AttestationResponse:
      type: object
      additionalProperties: false
      properties:
        clientDataJSON:
          type: string
          minLength: 2
          maxLength: 4096
          pattern: "^[A-Za-z0-9_-]+$"
          description: 规范base64url，解码1–3072字节；type=webauthn.create。
        attestationObject:
          type: string
          minLength: 2
          maxLength: 5462
          pattern: "^[A-Za-z0-9_-]+$"
          description: 规范base64url，解码1–4096字节；CBOR须完整且无尾随字节；只接受fmt=none和空attStmt。校验RP、UP/UV、credId、COSE
            -7、公钥曲线与固定用户句柄。
        transports:
          type: array
          minItems: 0
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum:
            - usb
            - nfc
            - ble
            - internal
            - hybrid
      required:
      - clientDataJSON
      - attestationObject
    WebAuthnAttestation:
      type: object
      additionalProperties: false
      properties:
        id:
          "$ref": "#/components/schemas/CredentialId"
        rawId:
          "$ref": "#/components/schemas/CredentialId"
        type:
          type: string
          enum:
          - public-key
        response:
          "$ref": "#/components/schemas/AttestationResponse"
        clientExtensionResults:
          "$ref": "#/components/schemas/ClientExtensionResults"
      required:
      - id
      - rawId
      - type
      - response
      - clientExtensionResults
    PasskeyCreateRequest:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          "$ref": "#/components/schemas/Base64url32"
        webauthnAttestation:
          "$ref": "#/components/schemas/WebAuthnAttestation"
      required:
      - challengeId
      - webauthnAttestation
    PasskeyRemovalIntentRequest:
      type: object
      additionalProperties: false
      properties:
        credentialId:
          "$ref": "#/components/schemas/CredentialId"
        password:
          "$ref": "#/components/schemas/PasswordInput"
      required:
      - credentialId
      - password
    PasskeyRemovalIntentResponse:
      type: object
      additionalProperties: false
      properties:
        removalIntentId:
          "$ref": "#/components/schemas/Base64url32"
        expiresAt:
          "$ref": "#/components/schemas/DateTime"
      required:
      - removalIntentId
      - expiresAt
    ClosureRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          "$ref": "#/components/schemas/PasswordInput"
        closureId:
          "$ref": "#/components/schemas/Base64url32"
        statusDigest:
          "$ref": "#/components/schemas/Base64url32"
      required:
      - password
      - closureId
      - statusDigest
    ClosureAccepted:
      type: object
      additionalProperties: false
      properties:
        closureId:
          "$ref": "#/components/schemas/Base64url32"
        dueAt:
          "$ref": "#/components/schemas/DateTime"
      required:
      - closureId
      - dueAt
    ClosurePendingStatus:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - PENDING
          - FINALIZING
        dueAt:
          "$ref": "#/components/schemas/DateTime"
      required:
      - state
      - dueAt
    ClosureCancelledStatus:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - CANCELLED
      required:
      - state
    ClosureClosedStatus:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - CLOSED_RELEASE_PENDING
        releaseReceipt:
          "$ref": "#/components/schemas/ReleaseReceipt"
      required:
      - state
    ClosureReleasedStatus:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - RELEASED
        releaseReceipt:
          "$ref": "#/components/schemas/ReleaseReceipt"
      required:
      - state
      - releaseReceipt
    ClosureStatus:
      oneOf:
      - "$ref": "#/components/schemas/ClosurePendingStatus"
      - "$ref": "#/components/schemas/ClosureCancelledStatus"
      - "$ref": "#/components/schemas/ClosureClosedStatus"
      - "$ref": "#/components/schemas/ClosureReleasedStatus"
    SlotRetirementRequest:
      type: object
      additionalProperties: false
      properties:
        retirementAuthorization:
          "$ref": "#/components/schemas/RetirementAuthorization"
      required:
      - retirementAuthorization
    SlotRetirementResponse:
      type: object
      additionalProperties: false
      properties:
        retirementReceipt:
          "$ref": "#/components/schemas/RetirementReceipt"
      required:
      - retirementReceipt
    SlotRetirementPending:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - RECEIPT_PENDING
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 300
      required:
      - state
      - retryAfterSeconds
      description: 终态/收据待办已提交，但尚无可验签收据；V保持原配额和退役待办，不签任何新资格。
    ErrorDetails:
      type: object
      additionalProperties: false
      properties:
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 300
      description: 只含安全的重试时间；不能包含邮箱、槽位、账号归属、密码政策字典或任何密钥材料。
    ErrorBody:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
              enum:
              - MALFORMED_REQUEST
              - AUTHENTICATION_FAILED
              - SESSION_INVALID
              - session_replaced
              - ACCOUNT_UNAVAILABLE
              - AUTHORIZATION_FAILED
              - RESOURCE_NOT_FOUND
              - IDEMPOTENCY_KEY_REUSED
              - OPERATION_PENDING
              - INTENT_INVALID
              - INTENT_EXPIRED
              - CHALLENGE_INVALID
              - CHALLENGE_EXPIRED
              - CREDENTIAL_STATE_CHANGED
              - CREDENTIAL_LIMIT_REACHED
              - CREDENTIAL_ALREADY_REGISTERED
              - RECOVERY_CODE_CONFIRMATION_FAILED
              - PASSWORD_POLICY_FAILED
              - REGISTRATION_TICKET_INVALID
              - REGISTRATION_TICKET_EXPIRED
              - REGISTRATION_TICKET_NOT_YET_VALID
              - SLOT_UNAVAILABLE
              - USERNAME_UNAVAILABLE
              - REGISTRATION_COMMITTED_LOGIN_REQUIRED
              - SESSION_CREATED_RETRY_LOGIN
              - SLOT_NOT_RETIRABLE
              - RESULT_EXPIRED
              - CLOSURE_STATUS_UNAVAILABLE
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - RATE_LIMITED
              - SERVICE_UNAVAILABLE
            message:
              type: string
              minLength: 1
              maxLength: 256
              description: 给用户的通用提示；不得包含其他账号、邮箱、面具或秘密。
            details:
              type: object
              additionalProperties: false
              properties:
                retryAfterSeconds:
                  type: integer
                  minimum: 1
                  maximum: 300
              description: 只含安全的重试时间；不能包含邮箱、槽位、账号归属、密码政策字典或任何密钥材料。
          required:
          - code
          - message
        requestId:
          "$ref": "#/components/schemas/Base64url16"
      required:
      - error
      - requestId
  responses:
    BadRequest:
      description: 400 MALFORMED_REQUEST：重复/未知JSON字段、错误类型、null、非规范编码、非法认证组合/请求体。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    Unauthorized:
      description: 401 AUTHENTICATION_FAILED：未知用户名、错密码、无效/已用恢复码与失效Passkey同形；会话无效/过期/撤销用SESSION_INVALID，被新移动会话接替用session_replaced。不返回账号存在性、归属或其他身份。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    Forbidden:
      description: 403 仅在有效独立证明后表示当前账号/操作不可用；不含封禁细节、邮箱或其他面具。内部入口不受信证书/工作负载拒绝；mTLS握手失败可以无HTTP响应。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    NotFound:
      description: 404 RESOURCE_NOT_FOUND：不存在/不属于本人/错误受限秘密同形；早到404不证明原提交未来不会完成。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    Conflict:
      description: 409 状态冲突、同键不同负载、并发版本变化或操作在途。USERNAME_UNAVAILABLE仅有效注册PoP后返回；注册/登录已提交重试只返回REGISTRATION_COMMITTED_LOGIN_REQUIRED/SESSION_CREATED_RETRY_LOGIN且无token。SLOT_NOT_RETIRABLE只允许内部V/C边界；不得外显旧账号信息。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    Gone:
      description: 410 INTENT_EXPIRED/CHALLENGE_EXPIRED表示受限操作不可再提交；RESULT_EXPIRED只表示核对数据超出保留期，不能解释为未提交，也不能自动登录取消注销。已清理请求/closureId墓碑命中也只回410
        RESULT_EXPIRED并拒绝重执行，不区分原结果成功或失败。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    PayloadTooLarge:
      description: 413 PAYLOAD_TOO_LARGE：请求体超过该端点字节上限；不接受部分解析/截断。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    UnsupportedMediaType:
      description: 415 UNSUPPORTED_MEDIA_TYPE：有JSON体的端点仅application/json UTF-8；不接受表单或multipart。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    UnprocessableEntity:
      description: 422 语义/密码策略/码确认/资格失败。REGISTRATION_TICKET_EXPIRED须重新收码同槽位换签；REGISTRATION_TICKET_NOT_YET_VALID仅小于等于60秒桶边界偏差给有界retryAfterSeconds，更大偏差按授时故障处理，不放宽验票窗口。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    RateLimited:
      description: 429 RATE_LIMITED：有界Retry-After；不能凭凭据是否存在让响应或时间暴露账号/邮箱配额。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Retry-After:
          "$ref": "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
    ServiceUnavailable:
      description: 503 SERVICE_UNAVAILABLE：数据库/签名服务/受信密钥/授时或灾备核对未就绪；结果未知，不得据此判断未提交或放开配额。灾备冻结包括认证、恢复、全部会话校验、受保护读写。
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorBody"
