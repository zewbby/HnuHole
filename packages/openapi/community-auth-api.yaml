openapi: 3.0.3
info:
  title: Hnuhole Community Authentication API
  version: 1.0.0-draft
  description: 社区认证方C的生产契约评审稿（2026-09-28），未实现、未经过独立安全审计或上线批准。日常认证为私有用户名+密码；学校邮箱、OTP、V
    flowId/安装ID/幂等键不允许进入任何C请求。V签名资格只给新账号准入，邮箱/资格/释放收据不能找回旧号。本文件与verifier-auth-api.yaml使用不同受信主机、独立权限/密钥/库/日志/编号。所有JSON对象拒绝额外字段、重复键、null替代必填项、非法UTF-8/错误类型和超大体；本版不支持无文档字段或未知版本，所有base64url严格解码、查长度并规范重编码。所有成功/错误/204响应Cache-Control:no-store、C自生成X-Request-ID；不使用认证cookie，CORS只允许固定受信客户端origin，不记录Authorization或秘密请求体。认证类型严格互斥且仅在其专属路径有效，拒绝重复Authorization头、混用方案、query凭据或未声明body。403/401/429不公开账号存在性/邮箱/槽位/其他面具，用户名占用只在有效注册PoP后受限公开。全部截止在权威库最终取得锁后用clock_timestamp()取实际UTC裁决并连续转换，不用事务开始时间。从旧备份恢复/时钟回退/钥撤销状态不明须冻结全部认证与受保护读写，外部可信证据重建后撤旧会话。所有有副作用幂等操作同键同负载原子认领，HMAC绑定值用数据库外独立密钥；并发在途键409
    OPERATION_PENDING并有界重试，终态保留超过声明的重试窗口。已提交注册/登录只给无秘密错误，重设/凭据管理可无秘密204；令牌及恢复原码绝不重发。request_results首次受理即以(operation,key_digest)建立唯一锚点，key_digest=SHA-256(ASCII("HNUHOLE/C-REQUEST-TOMBSTONE/V1")||0x00||原32字节幂等键)。完整结果到期后原行同事务原位变EXPIRED，清空除operation/key_digest/EXPIRED之外所有字段，永久保留该无身份唯一锚点，不删除后重插。本方key_digest另设唯一约束，拒同原键跨操作复用；EXPIRED只核对规范原键摘要，不再核对已清理的设备/意图绑定，不作原提交结论。closure申请首次提交同事务建立CLOSURE锚点，closureId用独立域HNUHOLE/C-CLOSURE-TOMBSTONE/V1；状态记录有界清理后仅留此锚点。EXPIRED锚点无原ID、时间、账号、slot、安装ID、请求HMAC或原提交结论；迟到原POST仅410
    RESULT_EXPIRED，绝不能当新请求重执行或重建七天申请。同键首次认领、完成与清理按operation/key_digest串行，取得键锁后复核live/EXPIRED；在途未有持久终态不能按TTL清理。
    所有Ed25519验签遵循注册协议第2.1节项目配置：bootstrap和V/C公钥A、签名R均须32字节规范曲线编码、非单位元且[L]P=I；S为32字节小端且0≤S<L。只用Pure Ed25519验原始固定正文，不能仅凭裸Verify成功接受弱点。PoP仅传64字节签名，153字节正文由保存的意图重建；固定向量和库差异见docs/design/auth-privacy-protocol-vectors.md。
servers:
- url: "/"
  description: 仅C独立受信API主机；部署时固定HTTPS，不由V或请求改写。
tags:
- name: Registration
  description: 只建立全新账号，不恢复旧号。
- name: Session
  description: 单移动会话、恢复、续期和独立撤销。
- name: Recovery
  description: 预设独立恢复凭据；不联系V、不自动登录。
- name: CredentialManagement
  description: 当前会话与新鲜密码复验后管理本人恢复方式。
- name: Closure
  description: 七天缓冲、权威截止与受限状态。
- name: Internal
  description: mTLS独立工作负载入口，不对公共客户端开放。
x-contract-status: preimplementation-security-review-draft
x-required-deployment-controls:
- fixed-rp-id-and-origin-allowlist-reviewed-for-native-passkeys
- separate-public-and-mtls-internal-listeners
- independent-v-and-c-hosts-identifiers-access-keys-logs-and-backups
- database-authoritative-account-session-credential-slot-transactions
- trusted-utc-and-monotonic-key-revocation-disaster-reconciliation
- all-sensitive-responses-no-store-and-no-secret-logging
paths:
  "/api/v1/auth/registration-intents":
    post:
      operationId: createRegistrationIntent
      summary: 建立待开户意图并一次性展示恢复码
      description: 在C权威数据库裁决点验证受信V密钥、REGISTER/V2固定编码、严格Ed25519公钥、槽位散列及当前/上一30分钟准入桶。未来桶不接受；距桶开始≤60秒仅提示短时重试原票，大偏差按授时故障处理。意图与挑战各32字节，最多10分钟，绑定不可修改的资格全文、用户名、密码验证值、恢复码摘要及C安装ID。不检查并公开用户名占用，不占槽位，不创建账号；成功后不回调V。原恢复码只在此首次201展示，无Idempotency-Key；响应丢失新建意图和新码，旧意图到期，不能重放原文。
      tags:
      - Registration
      security: []
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegistrationIntentRequest"
      responses:
        '201':
          description: 意图已持久建立；原恢复码只展示一次。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegistrationIntentResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      x-retry-semantics: lost-response-create-new-intent-no-secret-replay
  "/api/v1/auth/registrations":
    post:
      operationId: commitRegistration
      summary: 证明bootstrap私钥并原子开户
      description: 验证固定PoP消息：HNUHOLE/BOOTSTRAP-POP/V1||0x00||slot[32]||intentId[32]||challenge[32]||SHA-256(ticket全文)[32]。C只从保存的意图读取开户材料，不能接受用户名/密码/资格替换。最终锁内重新检查资格桶、意图10分钟期限、一次性挑战、严格PoP和完整恢复码确认；槽位ABSENT→ACTIVE与退役竞争，一个事务创建账号、恢复码、会话并消费意图。用户名冲突仅在有效PoP后返回USERNAME_UNAVAILABLE，处理意图却不消费槽位；资格过期则废弃意图/恢复码，须重新收码同槽位换签。首次提交201含新会话；已提交相同键只回409
        REGISTRATION_COMMITTED_LOGIN_REQUIRED，不含令牌或恢复码，用户用密码登录。事务/回包未知只重试原键，不重用已消费证明取得旧号会话。原完整结果已清理时，命中本operation的请求墓碑只回410
        RESULT_EXPIRED；不重新开户/签发会话，也不能用旧登录请求取消注销。
      tags:
      - Registration
      security: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegistrationRequest"
      responses:
        '201':
          description: 账号与唯一移动会话已原子提交。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Session-Expires-At:
              "$ref": "#/components/headers/SessionExpiresAt"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionCreated"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '410':
          "$ref": "#/components/responses/Gone"
      x-retry-semantics: same-key-same-payload-no-session-or-code-replay
  "/api/v1/auth/sessions":
    post:
      operationId: createSession
      summary: 用户名密码主动登录并接替旧设备
      description: 不存在用户名、错误密码走同形AUTHENTICATION_FAILED及受控等价计算路径；速率限制不能明显枚举账号。初步验证密码须记录所用密码验证值/凭据版本，最终账号锁内再次确认两者未变，变化就拒绝旧证明并要求全新密码校验，不能把恢复前的旧密码授权套到新版本。在账号锁内现场取UTC时间，拒绝CLOSED、到期FINALIZING及仍有效封禁；早于dueAt的主动成功登录原子取消PENDING_CLOSE并新建唯一移动会话，递增会话代次、撤销旧会话。初始有效期为实际裁决时间+30天，同设备重新登录也接替旧会话；不联系V。首次201含32字节随机token；已提交同键仅409
        SESSION_CREATED_RETRY_LOGIN，不重发token，客户端新键重新输入/确认密码登录替代不可见会话。后台刷新或恢复查询不是主动登录。原完整结果已清理时，命中本operation的请求墓碑只回410
        RESULT_EXPIRED；不重新开户/签发会话，也不能用旧登录请求取消注销。
      tags:
      - Session
      security: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SessionCreateRequest"
      responses:
        '201':
          description: 新会话已提交，旧移动会话立即失效。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Session-Expires-At:
              "$ref": "#/components/headers/SessionExpiresAt"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionCreated"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        '410':
          "$ref": "#/components/responses/Gone"
      x-retry-semantics: same-key-no-token-replay-new-key-explicit-login
  "/api/v1/auth/session":
    get:
      operationId: getCurrentSession
      summary: 恢复当前移动会话
      description: 每次从权威状态复核token摘要、会话代次、撤销/到期、账号终态及封禁；不能只依靠离线缓存。不是主动登录，不取消注销。有效ACTIVE会话满足静默续期条件时按同一事务延长原token的expiresAt；不换token或会话代次。App启动前先处理持久登出待办，不能把对应旧Bearer当可恢复会话。401时清本地token和导航节点，session_replaced可提示其他设备接替；503/超时保留安全存储token待核对，不误判退出。成功后另拉完整通道目录，不能用旧/部分目录冒充当前目录。
      tags:
      - Session
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 当前有效会话，仅返回本人资料。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Session-Expires-At:
              "$ref": "#/components/headers/SessionExpiresAt"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/api/v1/auth/session-renewals":
    post:
      operationId: renewCurrentSession
      summary: 为活跃的当前会话静默续期
      description: 只在用户正在进行正常登录后操作时调用，不按计时器维持长期无使用会话。与所有正常受保护请求采用同一规则：锁内实际时间检查仍有效ACTIVE会话/代次/账号/封禁，剩余≤7天时把expiresAt设为该裁决时间+30天，否则保持原值。原token、会话代次、安装ID和revocationSecret均不变；并发续期再次检查门槛，不能每个重试额外累加30天。PENDING_CLOSE、到期、撤销、替代及封禁不可续；不取消注销，不产生新设备或自动主动登录。无body/Idempotency-Key；503未知可安全重试当前token。服务器无法仅凭Bearer证明真实用户活跃，客户端禁止后台定时续期是本版产品约束。
      tags:
      - Session
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 现有会话截止已核对；未到门槛也返回原截止。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Session-Expires-At:
              "$ref": "#/components/headers/SessionExpiresAt"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SessionRenewed"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      x-retry-semantics: atomic-threshold-extension-same-token
  "/api/v1/auth/devices":
    get:
      operationId: getMobileDevices
      summary: 只读取当前与最近一次被替代移动设备状态
      description: 只允许当前有效Bearer读取本人设备页，固定当前项CURRENT及可选最近替代项REPLACED。最近替代记录仅30天评审基线，到期不返回历史；登录更新时原子覆盖，不能形成无界设备历史。仅返回角色与必要时间，不提供安装ID、原token、硬件指纹/型号、IP或多设备并行控制。本规则限手机App，不界定电脑管理员会话；读取可按既定活跃规则静默续期，不是主动登录。
      tags:
      - Session
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 最多两类设备状态，本人可见。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Session-Expires-At:
              "$ref": "#/components/headers/SessionExpiresAt"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeviceList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/api/v1/auth/session-revocations":
    post:
      operationId: revokeSession
      summary: 使用独立单向秘密只撤销对应旧会话
      description: '只接受Authorization: SessionRevoke <43字符>，拒绝Bearer、其他认证和body。revocationSecret=SHA-256(ASCII("HNUHOLE/SESSION-REVOKE/V1")||0x00||token[32])；C查SHA-256(ASCII("HNUHOLE/REVOKE-STORAGE/V1")||0x00||revocationSecret[32])。只能撤销这条会话，不读社区/账号、不撤销后来接替的新会话。客户端先持久登出标记，导出并安全保存秘密，再删Bearer，崩溃重启先处理标记；网络失败只留撤销秘密。规范秘密不论匹配活动/已撤销/已过期或已清理记录均204，只确认该能力没有对应活动会话，不能探测存在性；认证scheme错误401、编码错误400，503为结果未知。不能按本地旧expiresAt清待办，续期可能已提交却丢响应；以服务端204核对完成。收到204前泄漏的旧Bearer仍可能有效，提示本地退出、服务端撤销待确认。'
      tags:
      - Session
      security:
      - sessionRevoke: []
      responses:
        '204':
          description: 对应会话已不可用；无响应体且可重复。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      x-retry-semantics: same-secret-only-same-session-revocation
  "/api/v1/auth/recovery-code-reset-intents":
    post:
      operationId: createRecoveryCodeResetIntent
      summary: 用当前恢复码证明旧号控制权
      description: 规范恢复码摘要在C内定位账号，忘记用户名不需要邮箱。无效、已用、关闭/到期账号统一401。初步证明后须在账号锁内复核证明所见凭据版本与旧码仍有效；不能把过时证明绑定到新版本。原子废弃前一重设意图、递增重设意图代次，建立最长10分钟的唯一受限意图并一次性展示新恢复码与私有用户名。旧码暂留，直到最终重设才消费；新意图不创建会话、不取消七天注销、不解除处罚。无Idempotency-Key或原码重放；响应丢失用仍有效旧码新建意图，旧意图立即失效。
      tags:
      - Recovery
      security: []
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RecoveryCodeResetRequest"
      responses:
        '201':
          description: 受限重设意图已建立，只有首次展示新码。
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PasswordResetIntentResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '415':
          "$ref": "#/components/responses/UnsupportedMediaType"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/api/v1/auth/passkey-reset-options":
    post:
      operationId: createPasskeyResetOptions
      summary: 取得固定RP的可发现Passkey恢复挑战
      description: 请求体只能为{}，不接受用户名、邮箱、credentialId或账号ID。生成32字节challenge及challengeId，有效5分钟、不占账号或槽位，userVerification=required，不给allowCredentials。无Idempotency-Key；响应丢失新取选项。RP/origin必须由C部署受信配置固定，环境不共用。
      tags:
      - Recovery
      security: []
      requestBody:
        required: true
        x-max-bytes: 8192
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmptyRequest"
      responses:
        '200':
