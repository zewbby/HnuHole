      description: 客户端提交前生成并安全保存32字节closureId与status_secret；statusDigest=SHA-256(ASCII("HNUHOLE/CLOSE-STATUS/V1")||0x00||status_secret[32])，服务端不返回秘密。当前会话及正确密码，账号锁内复核初步密码证明所见验证值/凭据版本、会话代次、封禁与当前状态；密码版本已变就拒绝旧证明，禁言允许，仍有效封禁拒绝。closureId是本申请唯一幂等键，绑定原账号和statusDigest，锁内实际UTC时间+7天作为dueAt。同事务进入PENDING_CLOSE、停止未公开任务、撤销全部会话并递增会话代次；重复不重置期限。同ID重试仍须当前有效Bearer，已因本申请撤销时401并用状态能力核对，不接受历史token旁路。超时/早到状态404非未提交证明，不丢原ID/秘密、不换新ID、也不静默登录；暂存Bearer仅安全存储并禁止社区使用，确定后清除。到dueAt不再登录取消，worker迟到为FINALIZING。原申请完整记录清理后，closureId专属墓碑仍阻止重建；相同旧ID的迟到POST仅410
        RESULT_EXPIRED，不能重新开始七天。
