      properties:
        state:
          type: string
          enum:
          - NOT_ACCEPTED
        operation:
          $ref: '#/components/schemas/CommandOperation'
        reason:
          type: string
          enum:
          - COMMAND_SEALED
    ExpiredCommandResult:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - RESULT_EXPIRED
          description: A permanent prevention anchor exists but its former outcome is unavailable; never
            re-execute this command or infer nonacceptance.
    BusinessRejectionCode:
      type: string
      enum:
      - POST_CONTENT_INVALID
      - POST_IDENTITY_UNAVAILABLE
      - POST_CHANNEL_UNAVAILABLE
      - POSTING_RESTRICTED
      - ACCOUNT_CLOSING
      - TASK_NOT_FOUND
      - TASK_NOT_RETRYABLE
      - TASK_NOT_HIDEABLE
      - TASK_VERSION_CONFLICT
      - POST_NOT_FOUND
    TaskState:
      type: string
      enum:
      - ACCEPTED
      - PUBLISHED
      - FAILED
      - CANCELLED
      description: Effective server latest attempt state; UNKNOWN is exclusively client uncertainty. A
        persistent stop-generation mismatch yields irreversible FAILED even before bounded worker materialization.
        Terminal attempts never change state.
    FailureCode:
      type: string
      nullable: true
      enum:
      - PUBLICATION_FAILED
      - PUBLISHING_STOPPED
      - IDENTITY_INACTIVE
      - null
    OwnTaskSummary:
      type: object
      additionalProperties: false
      required:
      - taskId
      - postId
      - channelId
      - identityId
      - attemptVersion
      - state
      - acceptedAt
      - failureCode
      - visible
      - contentAvailable
      - canRetry
      - serverSortAt
      - terminalAt
      - canCancel
      - canHide
      properties:
        taskId:
          $ref: '#/components/schemas/ResourceID'
        postId:
          $ref: '#/components/schemas/ResourceID'
        channelId:
          $ref: '#/components/schemas/ResourceID'
        identityId:
          $ref: '#/components/schemas/ResourceID'
        attemptVersion:
          $ref: '#/components/schemas/AttemptVersion'
        state:
          $ref: '#/components/schemas/TaskState'
        acceptedAt:
          $ref: '#/components/schemas/UTCDateTime'
        failureCode:
          $ref: '#/components/schemas/FailureCode'
        visible:
          type: boolean
          description: Whether this task may be presented as a pending/failed own card; hidden cards cannot
            be reconstructed by result lookup.
        contentAvailable:
          type: boolean
        canRetry:
          type: boolean
          description: Informational own view only, false unless latest FAILED and current identity/permissions/content
            permit; retry revalidates.
        serverSortAt:
          $ref: '#/components/schemas/UTCDateTime'
          description: Exactly the latest acceptedAt; retry updates it, failure materialization does not.
            Stable task order is descending serverSortAt then taskId.
        terminalAt:
          type: string
          format: date-time
          nullable: true
          description: Null for effective ACCEPTED; otherwise immutable trusted terminal time. A derived
            stop uses the first stop event after the accepted generation, never observation time or a
            later punishment. Identity deletion first materializes prior stop outcomes before terminating
            remaining ACCEPTED attempts.
        canCancel:
          type: boolean
          description: Informational latest ACCEPTED maintenance permission, revalidated by command.
        canHide:
          type: boolean
          description: Informational latest FAILED and visible maintenance permission, revalidated by
            command.
    OwnTaskContent:
      type: object
      additionalProperties: false
      required:
      - title
      - body
      properties:
        title:
          $ref: '#/components/schemas/Title'
        body:
          $ref: '#/components/schemas/Body'
    OwnTaskDetail:
      type: object
      additionalProperties: false
      required:
      - task
      - content
      properties:
        task:
          $ref: '#/components/schemas/OwnTaskSummary'
        content:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - title
          - body
          properties:
            title:
              $ref: '#/components/schemas/Title'
            body:
              $ref: '#/components/schemas/Body'
          description: Latest immutable attempt text only when available/authorized; null when hidden/purged/cancelled.
            Never another attempt or ordinary draft.
    OwnTaskList:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OwnTaskDetail'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
    PublicAuthor:
      oneOf:
      - $ref: '#/components/schemas/ActivePublicAuthor'
      - $ref: '#/components/schemas/InactivePublicAuthor'
    ActivePublicAuthor:
      type: object
      additionalProperties: false
      required:
      - state
      - nickname
      - avatar
      properties:
        state:
          type: string
          enum:
          - ACTIVE
        nickname:
          type: string
          minLength: 1
          maxLength: 512
          description: Current authorized identity nickname, not the accepted-time snapshot.
        avatar:
          type: string
          enum:
          - default-v1
    InactivePublicAuthor:
      type: object
      additionalProperties: false
      required:
      - state
      - shortCode
      - avatar
      properties:
        state:
          type: string
          enum:
          - DELETED
          - ACCOUNT_CLOSED
        shortCode:
          type: string
          minLength: 12
          maxLength: 12
          pattern: ^[A-Z2-7]{12}$
          description: Stable uniformly random identity-level 60-bit code with database uniqueness/collision
            retry; no account relation, timestamp, sequential number or truncated UUID. Render 注销身份 ·
            code.
        avatar:
          type: string
          enum:
          - inactive-v1
    PublicPostCard:
      type: object
      additionalProperties: false
      required:
      - postId
      - channelId
      - title
      - author
      - publishedAt
      properties:
        postId:
          $ref: '#/components/schemas/ResourceID'
        channelId:
          $ref: '#/components/schemas/ResourceID'
        title:
          $ref: '#/components/schemas/Title'
        author:
          $ref: '#/components/schemas/PublicAuthor'
        publishedAt:
          $ref: '#/components/schemas/UTCDateTime'
    PublicPost:
