      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PublicPostCard'
        nextCursor:
          $ref: '#/components/schemas/NullableCursor'
    NullableCursor:
      type: string
      nullable: true
      minLength: 1
      maxLength: 1024
      pattern: ^[A-Za-z0-9_-]+$
    OwnPostCapabilities:
      type: object
      additionalProperties: false
      required:
      - postId
      - canDelete
      - canEdit
      properties:
        postId:
          $ref: '#/components/schemas/ResourceID'
