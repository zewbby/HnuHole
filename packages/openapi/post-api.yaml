      headers:
        Session-Expires-At:
          $ref: '#/components/headers/SessionExpiresAt'
        Server-Time:
          $ref: '#/components/headers/ServerTime'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ComposerContext'
    CommandSealedOrPreviouslyObserved:
