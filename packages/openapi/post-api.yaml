      - errorCode
      properties:
        state:
          type: string
          enum:
          - REJECTED
        operation:
          $ref: '#/components/schemas/CommandOperation'
        errorCode:
          $ref: '#/components/schemas/BusinessRejectionCode'
    SealedCommandResult:
      type: object
      additionalProperties: false
      required:
      - state
