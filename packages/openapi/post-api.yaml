      - attemptVersion
      properties:
        state:
          type: string
          enum:
          - COMMITTED
        operation:
          type: string
          enum:
          - HIDE_TASK
        taskId:
          $ref: '#/components/schemas/ResourceID'
        attemptVersion:
          $ref: '#/components/schemas/AttemptVersion'
    RejectedCommandResult:
      type: object
      additionalProperties: false
      required:
      - state
