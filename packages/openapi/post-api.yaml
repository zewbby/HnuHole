              enum:
              - MALFORMED_REQUEST
              - AUTHENTICATION_FAILED
              - SESSION_INVALID
              - session_replaced
              - AUTHORIZATION_UNAVAILABLE
              - SERVICE_UNAVAILABLE
              - RATE_LIMITED
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - CURSOR_INVALID
              - COMMAND_CONFLICT
              - COMMAND_SEALED
              - RESULT_EXPIRED
              - POST_CONTENT_INVALID
              - POST_IDENTITY_UNAVAILABLE
              - POST_CHANNEL_UNAVAILABLE
              - POSTING_RESTRICTED
              - ACCOUNT_CLOSING
              - TASK_NOT_FOUND
              - TASK_NOT_RETRYABLE
              - TASK_NOT_HIDEABLE
              - TASK_VERSION_CONFLICT
              - POST_NOT_FOUND
            message:
              type: string
              minLength: 1
              maxLength: 256
              description: Fixed bounded safe message, no raw database/transport error, text, identity/account
                detail or request key.
    OwnPostCard:
      type: object
      additionalProperties: false
      required:
