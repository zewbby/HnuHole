      headers:
        Session-Expires-At:
          $ref: '#/components/headers/SessionExpiresAt'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Server-Time:
          $ref: '#/components/headers/ServerTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeedPage'
    PostRead:
      description: Final-authorized visible published post and current public author projection.
      headers:
        Session-Expires-At:
          $ref: '#/components/headers/SessionExpiresAt'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Server-Time:
          $ref: '#/components/headers/ServerTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicPostResponse'
    CapabilitiesRead:
      description: Final-authorized minimal current account capabilities; no other identities or account
        selector.
      headers:
        Session-Expires-At:
          $ref: '#/components/headers/SessionExpiresAt'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Server-Time:
          $ref: '#/components/headers/ServerTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OwnPostCapabilities'
    BadRequest:
      description: Invalid boundary input or cursor; no authoritative conclusion about an earlier in-flight
        original command.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Missing/malformed Bearer, invalid/expired/revoked session, or session_replaced. Clear
        only current affected auth fence, retain original account-scoped intent; do not treat as failed
        publication or erase drafts.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Rejected Origin or current posting/account restriction; durable business rejection
        is observable by original key when one was recorded, never inferred solely from HTTP status.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Identical unknown/foreign/nonvisible resource result; no owner, other identity, hidden
        body or existence clue. Command queries never use this for absence.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Conflict:
      description: Durable business rejection, stale latest attempt, conflicting immutable key/digest,
        or a sealed original; no new effect. Reconcile the original key. Sealed matching replay returns
        COMMAND_SEALED; query proves NOT_ACCEPTED.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    PayloadTooLarge:
      description: Bounded bytes exceeded, not proof about an earlier command attempt.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    UnsupportedMediaType:
      description: Require declared application/json for body operations; no request payload logged.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    RateLimited:
      description: Bounded network/command quota; preserve intent and obey Retry-After, not a failed publication
        state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ServiceUnavailable:
      description: Gate frozen/unavailable, database/evidence failure or unknown commit outcome. Never
        retry under a new command or downgrade to FAILED; query or seal the immutable original after recovery.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    OwnPublishedPosts:
