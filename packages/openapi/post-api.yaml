      - $ref: '#/components/schemas/RejectedCommandResult'
      - $ref: '#/components/schemas/SealedCommandResult'
      - $ref: '#/components/schemas/ExpiredCommandResult'
  responses:
    CommandObserved:
      description: Authorized committed command observation, including query-only uncertainty or a winning
        seal.
      headers:
        Session-Expires-At:
          $ref: '#/components/headers/SessionExpiresAt'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Server-Time:
          $ref: '#/components/headers/ServerTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResult'
    OwnTasksListed:
      description: Final-authorized own visible task cards and account-bound cursor.
      headers:
        Session-Expires-At:
          $ref: '#/components/headers/SessionExpiresAt'
