      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OwnTaskList'
    OwnTaskRead:
      description: Final-authorized latest task state and separately available private payload.
      headers:
        Session-Expires-At:
          $ref: '#/components/headers/SessionExpiresAt'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Server-Time:
          $ref: '#/components/headers/ServerTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OwnTaskDetail'
    FeedRead:
