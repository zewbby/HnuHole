# Dedicated Redis 7 primary. Private paths, ACL passwords, environment and epoch
# must be chosen by the environment owner; this is not a deployment command.
bind 127.0.0.1
protected-mode yes
port 16381
maxmemory 128mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
aclfile /private/comment-snapshot/users.acl
dir /private/comment-snapshot/data
# Runtime ACL: own namespace only; GET SET DEL EXISTS PTTL TIME INFO EVAL
# EVALSHA PING HELLO and CLIENT SETNAME. No CONFIG, SCAN or global deletion.
# Operator is separate and additionally requires SCAN for explicit empty-domain
# initialization. Never grant the snapshot user access to admission/V keys.
