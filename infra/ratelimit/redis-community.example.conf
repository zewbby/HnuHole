# Development-only single primary. Create a separate V process/ACL file/port.
bind 127.0.0.1
port 6380
protected-mode yes
maxmemory 256mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
aclfile /run/secrets/hnuhole-community-ratelimit.acl
# Runtime ACL: default user off; community_ratelimit authenticates from a
# private external password and can access only ~hnuhole:community_dev:*.
# Required commands: TYPE GET SET PTTL TIME ZSCORE ZCARD ZADD ZREMRANGEBYSCORE
# PEXPIRE EVAL INFO PING HELLO AUTH CLIENT|SETNAME.
# Redis>=7.2 may additionally grant CLIENT|SETINFO; 7.0 does not have it.
# Separate community_ratelimit_operator ACL user/private password file adds
# CONFIG|GET to the same namespace key scope. Operator initialization requires namespace-owner
# SQL INSERT. The API runtime has neither SQL INSERT on namespace nor CONFIG.
