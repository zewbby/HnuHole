name: Authorization Gate

on:
  pull_request:
    paths:
      - 'services/api/internal/authprivacy/authorization_gate*.go'
      - 'services/api/authlab/run-isolated.sh'
      - 'services/api/authlab/run-shared-rate-limit-isolated.sh'
      - 'tools/ci/**'
      - '.github/workflows/authorization-gate.yml'
      - '.github/workflows/android-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorization-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Owned Go caches
        run: |
          mkdir -p "$RUNNER_TEMP/gate-build" "$RUNNER_TEMP/gate-mod" "$RUNNER_TEMP/gate-go"
          echo "GOCACHE=$RUNNER_TEMP/gate-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/gate-mod" >> "$GITHUB_ENV"
          echo "GOPATH=$RUNNER_TEMP/gate-go" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: false
      - name: Component scope selection regression
        run: python3 -m unittest discover -s tools/ci/tests -v
      - name: PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 redis-server python3-venv
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Pinned migration and owned media fixtures
        run: |
          GOBIN="$RUNNER_TEMP/gate-bin" go install github.com/pressly/goose/v3/cmd/goose@v3.22.1
          echo "$RUNNER_TEMP/gate-bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/gate-python"
          "$RUNNER_TEMP/gate-python/bin/pip" install -r services/api/media/requirements.txt
          echo "POST_MEDIA_PYTHON=$RUNNER_TEMP/gate-python/bin/python" >> "$GITHUB_ENV"
      - name: Formatting and build
        working-directory: services/api
        run: |
          test -z "$(gofmt -l internal/authprivacy/authorization_gate.go internal/authprivacy/authorization_gate_cancellation_test.go)"
          go build -mod=readonly ./...
      - name: New isolated C/V SQL, cancellation, recovery and affected backend regressions
        working-directory: services/api
        env:
          SHARED_RATE_PG_PORT: '55464'
          AUTHLAB_FULL_SUITE: '1'
        run: sh authlab/run-shared-rate-limit-isolated.sh
