name: Comments core

on:
  pull_request:
    paths:
      - 'services/api/internal/comments/**'
      - 'apps/mobile/lib/src/comments/**'
      - 'apps/mobile/lib/src/system_notifications/**'
      - 'apps/mobile/lib/src/identity/identity_switcher.dart'
      - 'apps/mobile/lib/src/identity/active_identity_controller.dart'
      - 'apps/mobile/lib/src/navigation/**'
      - 'apps/mobile/lib/src/posts/post_controller.dart'
      - 'apps/mobile/lib/src/posts/personal_profile.dart'
      - 'apps/mobile/lib/src/messaging/dm_runtime.dart'
      - 'apps/mobile/test/active_identity_test.dart'
      - 'apps/mobile/lib/src/messaging/direct_message_inbox.dart'
      - 'apps/mobile/lib/main.dart'
      - 'apps/mobile/test/notification_inbox_test.dart'
      - 'apps/mobile/test/app_navigation_test.dart'
      - 'apps/mobile/test/comment_*'
      - 'packages/openapi/**'
      - 'packages/comment-protocol-vectors/**'
      - 'tools/check-comment-contract.py'
      - 'tools/check-comment-business-contract.py'
      - 'tools/check-notification-contract.py'
      - 'tools/tests/test_comment_contract.py'
      - '.github/workflows/comments-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comments-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache-dependency-path: services/api/go.sum
      - name: Comment rule tests, race checks, build and vet
        # Pure rules only. SQL/HTTP/runtime acceptance is a separate stage.
        run: |
          go test -mod=readonly -race -count=1 ./internal/comments
          go build -mod=readonly ./...
          go vet -mod=readonly ./...
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Locked dependencies
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter pub get --enforce-lockfile
      - name: Analyze mobile and exercise comment core
        # SQLite exercises the production encrypted journal; widget adapters are
        # explicit fixtures. Hardware vault and device checks remain separate.
        run: |
          flutter analyze --no-pub
          flutter test --no-pub test/comment_core_test.dart test/comment_protocol_test.dart test/comment_journal_test.dart test/comment_views_test.dart test/comment_http_test.dart test/comment_failure_view_test.dart test/comment_runtime_test.dart test/post_images_test.dart test/post_media_repository_test.dart
          flutter test --no-pub test/notification_inbox_test.dart test/app_navigation_test.dart test/direct_message_screen_test.dart test/governance_test.dart test/governance_http_test.dart
          flutter test --no-pub test/active_identity_test.dart test/personal_profile_test.dart test/feed_scroll_refresh_test.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android comments integration
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'cmake;3.22.1'
          flutter build apk --debug --no-pub
      - name: Preserve dependency locks
        run: git diff --exit-code -- pubspec.lock
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository pinned validators
        run: python -m pip install -r packages/openapi/requirements-check.txt
      - name: Validate complete specifications and comment boundaries
        run: |
          python packages/openapi/check-specs.py
          python tools/check-comment-contract.py
          python tools/check-comment-business-contract.py
          python tools/check-notification-contract.py
          python -m unittest discover -s tools/tests -p test_comment_contract.py -v
