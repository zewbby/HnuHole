name: Feed staging tools
on:
  pull_request:
    paths:
      - 'tools/feed_staging/**'
      - '.github/workflows/feed-staging-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-fault-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private one-shot scope and strict body framing
        run: python3 -m unittest discover -s tools/feed_staging -p 'test_*.py' -v
