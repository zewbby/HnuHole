name: Direct message presentation

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/direct-messages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-and-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android toolchain used by Flutter 3.47.5
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Locked dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and exercise presentation boundaries
        working-directory: apps/mobile
        run: |
          flutter analyze --no-pub
          flutter test --no-pub test/direct_message_screen_test.dart test/direct_message_navigation_test.dart test/direct_message_preview_test.dart test/app_navigation_test.dart test/login_home_navigation_test.dart test/personal_route_account_test.dart
          flutter build bundle --debug --no-pub
      - name: Build isolated Android preview
        working-directory: apps/mobile
        env:
          HNUHOLE_DM_PREVIEW: '1'
        run: |
          flutter build apk --debug --no-pub -t tool/direct_message_preview.dart
          for tool in "$ANDROID_HOME"/build-tools/*/aapt; do aapt="$tool"; done
          metadata=$("$aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk | sed -n '1p')
          [[ "$metadata" == *"name='org.hnuhole.hnuhole_mobile.dmpreview'"* ]]
      - name: Preserve locks
        run: git diff --exit-code -- '**/pubspec.lock'
