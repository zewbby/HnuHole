name: Direct message text and presentation

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'services/api/internal/authprivacy/**'
      - 'services/api/internal/authprivacyhttp/**'
      - 'services/api/internal/authprivacyruntime/**'
      - 'services/api/migrations/**'
      - 'infra/postgres/**'
      - 'tools/check-direct-message-contract.py'
      - '.github/workflows/direct-messages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reliable-text-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r packages/openapi/requirements-check.txt
          python tools/check-direct-message-contract.py
          sudo apt-get update && sudo apt-get install -y postgresql-16
          go install github.com/pressly/goose/v3/cmd/goose@v3.22.1
      - name: New DM transactions and affected comment binding
        env:
          PGPORT: '55468'
          COMMENT_TEST_PATTERN: '^(TestDMFirst|TestDMGoose|TestDMReliable|TestCommentTextTransactionsPostgres$)'
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          bash services/api/authlab/run-comment-text-isolated.sh
      - name: Build and vet changed service packages
        working-directory: services/api
        run: |
          go build -mod=readonly ./cmd/authdev
          go vet -mod=readonly ./internal/authprivacy ./internal/authprivacyhttp ./internal/authprivacyruntime
  flutter-and-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android toolchain used by Flutter 3.47.5
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Locked dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and exercise presentation boundaries
        working-directory: apps/mobile
        run: |
          flutter analyze --no-pub
          flutter test --no-pub test/dm_reliability_test.dart test/dm_route_test.dart test/dm_visible_read_test.dart test/direct_message_screen_test.dart test/direct_message_navigation_test.dart test/direct_message_preview_test.dart test/app_navigation_test.dart test/login_home_navigation_test.dart test/personal_route_account_test.dart test/comment_views_test.dart test/feed_ui_test.dart
          flutter build bundle --debug --no-pub
      - name: Build isolated Android text integration
        working-directory: apps/mobile
        env:
          HNUHOLE_DM_TEXT: '1'
        run: |
          flutter build apk --debug --no-pub --dart-define=DM_TEXT_INTEGRATION=true
          for tool in "$ANDROID_HOME"/build-tools/*/aapt; do aapt="$tool"; done
          metadata=$("$aapt" dump badging build/app/outputs/flutter-apk/app-debug.apk | sed -n '1p')
          [[ "$metadata" == *"name='org.hnuhole.hnuhole_mobile.dmtext'"* ]]
      - name: Preserve locks
        run: git diff --exit-code -- '**/pubspec.lock'
